<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquetas en el celular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Solo para mirar las maquetas: cualquier pantalla dentro de un marco de 390 × 844 px
     (iPhone 14), con las demás a mano. La pantalla va después del #: celular.html#hoy.html */
  :root{ --bg:#D9D7E6; --ink:#312F45; --ink-soft:#6C6A84; --accent-deep:#5B5FA0; --paper:#fff; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0F0E16; --ink:#ECEBF5; --ink-soft:#A9A7C2; --accent-deep:#9CA2DE; --paper:#262536; } }
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px;box-sizing:border-box;}
  h1{font-family:'Baloo 2',system-ui,sans-serif;font-size:20px;margin:0;}
  nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  nav a{padding:8px 14px;border-radius:100px;background:var(--paper);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;}
  nav a[aria-current="page"]{background:var(--accent-deep);color:#fff;}
  .marco{width:390px;height:844px;max-width:100%;border:10px solid #2B2A3A;border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);background:#fff;}
  iframe{width:390px;height:844px;border:0;display:block;}
  .volver{font-size:13px;color:var(--ink-soft);}
</style>
</head>
<body>
  <h1>Maquetas en el celular · 390 px</h1>
  <nav id="paginas" aria-label="Pantallas"></nav>
  <div class="marco"><iframe id="pantalla" title="Maqueta en el celular"></iframe></div>
  <a class="volver" id="volver" href="hoy.html">Volver a la versión de compu</a>
<script>
  const PAGINAS = [['hoy.html','Hoy'],['sittings.html','Registros'],['finanzas.html','Plata'],['mas.html','Más'],['ninieras.html','Niñeras'],['postulantes.html','Postulantes']];
  function mostrar(){
    const pedida = decodeURIComponent(location.hash.slice(1));
    const actual = PAGINAS.some(([p])=>p===pedida) ? pedida : 'hoy.html';
    document.getElementById('pantalla').src = actual;
    document.getElementById('volver').href = actual;
    document.getElementById('paginas').innerHTML = PAGINAS.map(([p, nombre])=>
      `<a href="#${p}"${p===actual?' aria-current="page"':''}>${nombre}</a>`).join('');
  }
  window.addEventListener('hashchange', mostrar);
  mostrar();
</script>
</body>
</html>
