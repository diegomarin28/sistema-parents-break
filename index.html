<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Parents Break</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#757CBB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parents Break">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
:root{
  --bg:#F6F5FB; --paper:#FFFFFF; --ink:#312F45; --ink-soft:#6C6A84; --line:#E3E1EE;
  --accent:#757CBB; --accent-soft:#E7E8F5; --clay:#DF8386; --clay-soft:#FBE7E8; --clay-text:#B8555A;
  --good:#3E7D4F; --good-soft:#E3EFE3; --warn:#B9862E; --warn-soft:#F7EBD4; --bad:#AB4B41; --bad-soft:#F5E1DD;
  --shadow-sm: 0 1px 2px rgba(49,47,69,.05), 0 1px 4px rgba(49,47,69,.05);
  --shadow-md: 0 6px 20px rgba(49,47,69,.10);
  --gutter: 14px;
  --ease: 180ms cubic-bezier(.4,0,.2,1);
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;}
.wrap{margin:0;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay-text);margin-bottom:6px;}
h1{font-size:27px;font-weight:600;}
.sub{color:var(--ink-soft);font-size:14px;margin-top:5px;max-width:640px;line-height:1.5;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.who{font-size:12.5px;color:var(--ink-soft);text-align:right;}
.who button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:12.5px;padding:0;margin-top:3px;}
.homeintro{margin:12px 0 28px;}
.homeintro h1{font-size:26px;margin-top:4px;}
.backbtn{background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;transition:all var(--ease);font-family:'Inter',sans-serif;}
.backbtn:hover{border-color:var(--accent);color:var(--accent);}
.modtitle{font-size:24px;margin:14px 0 20px;}
.subnav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 20px;flex-wrap:wrap;}
.subtab{font-weight:600;font-size:13.5px;color:var(--ink-soft);background:none;border:none;padding:9px 4px;cursor:pointer;border-bottom:2px solid transparent;margin-right:16px;font-family:'Inter',sans-serif;transition:color var(--ease), border-color var(--ease);}
.subtab:hover{color:var(--accent);}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent);}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:var(--gutter);box-shadow:var(--shadow-sm);animation:fadeIn var(--ease);}
.card h2{font-size:16.5px;font-weight:600;letter-spacing:-0.01em;margin:0 0 10px;}
.card h2:first-child{margin-top:0;}
.card>.helper:first-child{margin-top:0;}
.card-section-title{font-size:14px;font-weight:700;font-family:'Baloo 2',sans-serif;margin:18px 0 10px;}
.card-section-title:first-child{margin-top:0;}
.helper{color:var(--ink-soft);font-size:13px;margin:4px 0 12px;line-height:1.5;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);font-family:'Inter',sans-serif;
  transition:border-color var(--ease), box-shadow var(--ease);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
button:focus-visible{border-radius:8px;}
textarea{resize:vertical;min-height:54px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter);}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gutter);}
.field{margin-bottom:12px;}
.mesnav{display:inline-flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow-sm);}
.mesnav button{width:30px;height:30px;border-radius:8px;border:none;background:none;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--ease), color var(--ease);}
.mesnav button:hover{background:var(--bg);color:var(--accent);}
.mesnav button svg{width:15px;height:15px;}
.mesnav-label{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;color:var(--ink);padding:0 10px;min-width:150px;text-align:center;}
.q{background:var(--accent-soft);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:13.5px;color:var(--ink);line-height:1.45;}
.scorebar{display:flex;gap:6px;margin-top:10px;}
.scorebtn{flex:1;text-align:center;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);}
.scorebtn.selected{background:#666EAE;border-color:#666EAE;color:#fff;}
.scorelabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
.flag-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);}
.flag-row:last-child{border-bottom:none;}
.flag-row input{margin-top:3px;}
.flag-row span{font-size:13.5px;line-height:1.4;}
.flag-row.critical span::after{content:" · crítico";color:var(--bad);font-size:11px;font-weight:600;}
.refrow{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;margin-bottom:8px;align-items:center;}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.refrow .chk{gap:6px;}
.smallbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-family:'Inter',sans-serif;}
.smallbtn:hover{border-color:var(--accent);color:var(--accent);}
.smallbtn.danger:hover{border-color:var(--bad);color:var(--bad);}
.resultcard{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.gauge{width:88px;height:88px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.gauge .inner{width:68px;height:68px;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge .num{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:600;}
.gauge .max{font-size:10px;color:var(--ink-soft);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;font-size:12.5px;font-weight:700;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.badge.good{background:var(--good-soft);color:var(--good);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.bad{background:var(--bad-soft);color:var(--bad);}
.badge.brand{background:var(--clay-soft);color:var(--clay-text);}
.resultnote{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{font-weight:600;font-size:14px;border-radius:10px;padding:11px 20px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:transform var(--ease), box-shadow var(--ease), background var(--ease);}
.btn.primary{background:#666EAE;color:#fff;box-shadow:var(--shadow-sm);}
.btn.primary:hover:not(:disabled){background:#5D64A0;box-shadow:var(--shadow-md);}
.btn.primary:active:not(:disabled){transform:scale(.98);}
.btn.primary:disabled{background:#C7C6DA;cursor:not-allowed;}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn.danger{background:var(--clay-text);color:#fff;}
.btn.danger:hover{background:#9C4448;}
.confirmoverlay{position:fixed;inset:0;background:rgba(49,47,69,.35);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;transition:opacity 180ms ease;padding:20px;}
.confirmoverlay.show{opacity:1;}
.confirmbox{background:var(--paper);border-radius:16px;padding:22px 24px;max-width:380px;width:100%;box-shadow:var(--shadow-md);transform:translateY(8px) scale(.98);transition:transform 180ms cubic-bezier(.2,.8,.2,1);position:relative;}
.modal-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--ease), color var(--ease);}
.modal-close:hover{background:var(--clay-soft);color:var(--clay-text);}
.confirmoverlay.show .confirmbox{transform:translateY(0) scale(1);}
.confirmmsg{font-size:14.5px;color:var(--ink);line-height:1.5;margin-bottom:18px;}
.confirmbtns{display:flex;justify-content:flex-end;gap:10px;}
.warnbox{background:var(--warn-soft);border:1px solid #E4C888;border-radius:9px;padding:10px 13px;font-size:13px;color:#7A5A16;margin-top:14px;line-height:1.5;}
.okbox{background:var(--good-soft);border:1px solid #B9D9BE;border-radius:9px;padding:10px 13px;font-size:13px;color:var(--good);margin-top:14px;line-height:1.5;}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow-sm);transition:transform var(--ease), box-shadow var(--ease);position:relative;}
.pcard-delete{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:none;background:#fff;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;transition:opacity var(--ease), background var(--ease), color var(--ease);box-shadow:var(--shadow-sm);}
.pcard-delete:hover,.pcard-delete:focus-visible{opacity:1;background:var(--clay-soft);color:var(--clay-text);}
.pcard-delete svg{width:13px;height:13px;}
.pcard .ph{width:100%;aspect-ratio:1;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:600;margin-bottom:10px;overflow:hidden;}
.pcard .ph img{width:100%;height:100%;object-fit:cover;}
.pcard .name{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:600;}
.pcard .meta{font-size:12.5px;color:var(--ink-soft);margin:3px 0 10px;line-height:1.5;}
.pcard .rowbtns{display:flex;gap:6px;flex-wrap:wrap;}
.empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:40px 0;}
.candlist .item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform var(--ease), box-shadow var(--ease), border-color var(--ease);width:100%;text-align:left;font-family:'Inter',sans-serif;}
.candlist .item:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.candlist .item .name{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:600;}
.candlist .item .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.candlist .item .sc{margin-left:auto;text-align:right;}
.candlist .item .sc .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}
.detailback{background:none;border:none;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;padding:0;margin-bottom:14px;}
.psico-img{width:100%;max-width:260px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;}
details.crit{margin-top:8px;font-size:13px;color:var(--ink-soft);}
details.crit summary{cursor:pointer;font-weight:600;color:var(--accent);}
details.crit ul{margin:8px 0 0;padding-left:18px;line-height:1.6;}
.placeholder{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.placeholder h2{font-size:19px;margin-bottom:8px;color:var(--ink);}
.placeholder p{max-width:440px;margin:0 auto;line-height:1.6;font-size:14px;}
.fichadl{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px;}
.fichadl div{padding:4px 0;border-bottom:1px dashed var(--line);white-space:pre-line;}
.fichadl b{color:var(--ink-soft);font-weight:600;display:block;font-size:11px;text-transform:uppercase;letter-spacing:.02em;}
.asigtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
.asigtable th,.asigtable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tablewrap .asigtable{min-width:480px;}
.tablecell-btns{display:inline-flex;gap:6px;}
.margenpos{color:var(--good);font-weight:600;}
.margenneg{color:var(--bad);font-weight:600;}
.loginstage{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);}
.loginbrand{position:relative;overflow:hidden;background:var(--accent);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:60px;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:drift 20s ease-in-out infinite;}
.blob-a{width:380px;height:380px;background:var(--clay);top:-100px;right:-80px;animation-duration:22s;}
.blob-b{width:320px;height:320px;background:#fff;bottom:-120px;left:-60px;opacity:.16;animation-duration:26s;animation-delay:-6s;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-20px) scale(1.06);}66%{transform:translate(-20px,25px) scale(0.96);}}
.loginbrand-logo{height:44px;filter:brightness(0) invert(1);position:relative;z-index:1;margin-bottom:28px;animation:logoIn 600ms cubic-bezier(.2,.8,.2,1);}
@keyframes logoIn{from{opacity:0;transform:translateY(-8px) scale(.94);}to{opacity:1;transform:translateY(0) scale(1);}}
.loginbrand h1{position:relative;z-index:1;color:#fff;font-size:32px;max-width:380px;line-height:1.25;animation:fadeIn 500ms 100ms both;}
.loginbrand p{position:relative;z-index:1;color:rgba(255,255,255,.85);font-size:14.5px;max-width:340px;line-height:1.6;margin-top:14px;animation:fadeIn 500ms 180ms both;}
.loginformside{display:flex;align-items:center;justify-content:center;padding:40px;}
.loginwrap{width:100%;max-width:340px;animation:fadeIn 500ms 200ms both;}
.loginwrap h2{font-size:22px;margin-bottom:6px;}
.loginwrap .helper{margin-bottom:26px;}
.inputicon{position:relative;}
.inputicon svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);pointer-events:none;}
.inputicon input{padding-left:34px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:2px;}
.spinner.dark{border-color:var(--line);border-top-color:var(--accent);}
@keyframes spin{to{transform:rotate(360deg);}}
@media (max-width:760px){.loginstage{grid-template-columns:1fr;grid-template-rows:auto 1fr;}.loginbrand{padding:36px 28px;min-height:180px;}.loginbrand h1{font-size:22px;}.loginbrand p{display:none;}.loginformside{padding:28px;}}
.toaststack{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-md);animation:toastIn 220ms cubic-bezier(.2,.8,.2,1);max-width:300px;}
.toast.good{background:var(--good);}
.toast.bad{background:var(--bad);}
.toast.leaving{animation:toastOut 200ms ease forwards;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px);}}
.appshell{position:fixed;inset:0;display:flex;}
.sidebar{width:196px;flex-shrink:0;height:100%;background:#5B5FA0;padding:22px 14px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sidebar-logo-wrap{background:#fff;border-radius:12px;padding:8px 12px;margin:0 6px 30px;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.sidebar-logo{height:42px;display:block;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.18);padding:14px 6px 2px;font-size:12.5px;color:rgba(255,255,255,.68);line-height:1.6;}
.sidebar-foot button{background:none;border:none;color:#fff;font-weight:600;cursor:pointer;font-size:12.5px;padding:0;margin-top:3px;font-family:'Inter',sans-serif;}
.mainarea{flex:1;min-width:0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#modcontent{max-width:960px;margin:0 auto;padding:26px 32px 100px;}
.navitem{display:flex;align-items:center;gap:10px;background:none;border:none;border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;transition:background var(--ease);font-family:'Inter',sans-serif;width:100%;}
.navitem:hover{background:rgba(255,255,255,.1);}
.navitem.active{background:rgba(255,255,255,.2);}
.navitem.active .navitem-label{color:#fff;}
.navitem.active .navitem-ic{background:rgba(255,255,255,.32);color:#fff;}
.navitem-ic{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.navitem-ic svg{width:14px;height:14px;stroke-width:2.1;}
.navitem-label{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13.5px;color:rgba(255,255,255,.92);}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gutter);margin-bottom:var(--gutter);}
.statcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);}
.statnum{font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:700;color:var(--ink);}
.statlabel{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.statnum-trend{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.4;}
.chartcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.chartlegend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);}
.chartlegend span{display:flex;align-items:center;gap:4px;}
.chartdot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.person-list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);}
.person-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);}
.person-row:last-child{border-bottom:none;}
.person-row .av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:'Baloo 2',sans-serif;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.person-row .av img{width:100%;height:100%;object-fit:cover;}
.person-row .info{flex:1;min-width:0;}
.person-row .info .name{font-family:'Baloo 2',sans-serif;font-size:14px;font-weight:600;}
.person-row .info .meta{font-size:11.5px;color:var(--ink-soft);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.person-row .badge-slot{width:88px;flex-shrink:0;}
.person-row .rowbtns{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.confirmbox.wide{max-width:640px;max-height:88vh;overflow-y:auto;}
.pendbanner{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left;width:100%;font-family:'Inter',sans-serif;transition:transform var(--ease), border-color var(--ease);box-shadow:var(--shadow-sm);}
.pendbanner:hover{transform:translateY(-2px);border-color:#C8C6DC;}
.pendbanner-left{display:flex;align-items:center;gap:12px;}
.pendbanner-num{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:700;color:var(--clay-text);}

function toast(msg, type='good'){
  let stack = document.querySelector('.toaststack');
  if(!stack){ stack = document.createElement('div'); stack.className='toaststack'; document.body.appendChild(stack); }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.classList.add('leaving'); setTimeout(()=>el.remove(), 220); }, 3200);
}

function confirmarAccion(mensaje, textoBoton='Eliminar'){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirmoverlay';
    overlay.innerHTML = `
      <div class="confirmbox">
        <div class="confirmmsg">${mensaje}</div>
        <div class="confirmbtns">
          <button class="btn ghost" id="confirm-no">Cancelar</button>
          <button class="btn danger" id="confirm-si">${textoBoton}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(()=>overlay.classList.add('show'));
    function cerrar(resultado){
      overlay.classList.remove('show');
      setTimeout(()=>overlay.remove(), 180);
      resolve(resultado);
    }
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cerrar(false); });
    overlay.querySelector('#confirm-no').addEventListener('click', ()=>cerrar(false));
    overlay.querySelector('#confirm-si').addEventListener('click', ()=>cerrar(true));
  });
}

let modalToken = 0;
function abrirModal(html){
  modalToken++;
  let overlay = document.getElementById('editmodal');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.className = 'confirmoverlay';
    overlay.id = 'editmodal';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cerrarModal(); });
  }
  overlay.innerHTML = `<div class="confirmbox wide"><button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar">×</button>${html}</div>`;
  requestAnimationFrame(()=>overlay.classList.add('show'));
}
let modalNodoOrigen = null;
function abrirModalConNodo(node, headerHtml=''){
  modalToken++;
  let overlay = document.getElementById('editmodal');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.className = 'confirmoverlay';
    overlay.id = 'editmodal';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cerrarModal(); });
  }
  modalNodoOrigen = { node, parent: node.parentNode, next: node.nextSibling };
  const box = document.createElement('div');
  box.className = 'confirmbox wide';
  box.innerHTML = `<button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar">×</button>`;
  if(headerHtml) box.innerHTML += headerHtml;
  box.appendChild(node);
  overlay.innerHTML = '';
  overlay.appendChild(box);
  requestAnimationFrame(()=>overlay.classList.add('show'));
}
function cerrarModal(){
  const overlay = document.getElementById('editmodal');
  if(!overlay) return;
  const myToken = modalToken;
  overlay.classList.remove('show');
  setTimeout(()=>{
    if(modalToken !== myToken) return; // se abrió un modal nuevo mientras este se cerraba — no lo pisemos
    if(modalNodoOrigen){
      const {node, parent, next} = modalNodoOrigen;
      if(parent){ parent.insertBefore(node, next); }
      modalNodoOrigen = null;
    }
    overlay.remove();
  }, 180);
}

function fechaHoyLarga(){
  const f = new Intl.DateTimeFormat('es-UY', {weekday:'long', day:'numeric', month:'long'}).format(new Date());
  return f.charAt(0).toUpperCase() + f.slice(1);
}

      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px;">

async function loadDashboardData(){
  try{
    const [{data:pipelineRows}, {data:ninierasRows}, {data:familiasRows}] = await Promise.all([
      sb.from('candidatas').select('estado').in('estado', ['intake','entrevistada']),
      sb.from('ninieras').select('tipo').eq('activa', true),
      sb.from('familias').select('cobro_hora'),
    ]);
    const nums = document.querySelectorAll('#statrow .statnum');
    const pipeline = pipelineRows||[];
    const sinEntrevistar = pipeline.filter(r=>r.estado==='intake').length;
    const entrevistadas = pipeline.filter(r=>r.estado==='entrevistada').length;
    if(nums[0]) nums[0].textContent = pipeline.length;
    const tProceso = document.getElementById('trend-proceso');
    if(tProceso) tProceso.textContent = pipeline.length ? `${sinEntrevistar} sin entrevistar · ${entrevistadas} entrevistada${entrevistadas===1?'':'s'}` : 'Nadie en el pipeline ahora';

    const ninieras = ninierasRows||[];
    if(nums[1]) nums[1].textContent = ninieras.length;
    const soloNinera = ninieras.filter(n=>(n.tipo||'Niñera')==='Niñera').length;
    const traslados = ninieras.filter(n=>n.tipo==='Traslados').length;
    const ambas = ninieras.filter(n=>n.tipo==='Ambas').length;
    const tNin = document.getElementById('trend-ninieras');
    if(tNin) tNin.textContent = `${soloNinera} niñera · ${traslados} traslados · ${ambas} ambas`;

    const familias = familiasRows||[];
    if(nums[2]) nums[2].textContent = familias.length;
    const conTarifa = familias.filter(f=>f.cobro_hora!==null && f.cobro_hora!=='').length;
    const tFam = document.getElementById('trend-familias');
    if(tFam) tFam.textContent = `${conTarifa} con tarifa fija cargada`;
  }catch(e){}

  try{
    const [{data:sits}, {data:gastos}] = await Promise.all([
      sb.from('sittings_traslados').select('fecha,cobro_familia,pago_ninera'),
      sb.from('gastos_generales').select('fecha,monto'),
    ]);
    const porMes = {};
    (sits||[]).forEach(r=>{
      if(!r.fecha) return;
      const mes = r.fecha.slice(0,7);
      if(!porMes[mes]) porMes[mes] = {ingresos:0, gastos:0};
      porMes[mes].ingresos += Number(r.cobro_familia)||0;
      porMes[mes].gastos += Number(r.pago_ninera)||0;
    });
    (gastos||[]).forEach(g=>{
      if(!g.fecha) return;
      const mes = g.fecha.slice(0,7);
      if(!porMes[mes]) porMes[mes] = {ingresos:0, gastos:0};
      porMes[mes].gastos += Number(g.monto)||0;
    });
    const meses = Object.keys(porMes).sort().slice(-6);
    const wrap = document.getElementById('finmesChartWrap');
    const canvas = document.getElementById('finmesChart');
    if(canvas && meses.length && window.Chart){
      const labels = meses.map(m=>{
        const [y,mm] = m.split('-').map(Number);
        const f = new Intl.DateTimeFormat('es-UY', {month:'short'}).format(new Date(y, mm-1, 1));
        return (f.charAt(0).toUpperCase()+f.slice(1)).replace('.','');
      });
      if(dashChart){ dashChart.destroy(); dashChart = null; }
      dashChart = new Chart(canvas, {
        type:'bar',
        data:{ labels, datasets:[
          {label:'Ingresos', data:meses.map(m=>Math.round(porMes[m].ingresos)), backgroundColor:'#757CBB', borderRadius:4, barThickness:22},
          {label:'Gastos', data:meses.map(m=>Math.round(porMes[m].gastos)), backgroundColor:'#DF8386', borderRadius:4, barThickness:22},
        ]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
          scales:{
            y:{ grid:{color:'#E3E1EE'}, ticks:{color:'#6C6A84', font:{size:10}, callback:v=>'$'+Math.round(v/1000)+'k'} },
            x:{ grid:{display:false}, ticks:{color:'#6C6A84', font:{size:11.5}} }
          } }
      });
    } else if(wrap){
      wrap.innerHTML = '<div class="empty">Todavía no hay suficientes sittings o gastos cargados para graficar por mes.</div>';
    }
  }catch(e){}

  const box = document.getElementById('agenda');
  let agendaItems = [];
  try{
    const [{ data, error }, { data: ninTipos }] = await Promise.all([
      sb.from('asignaciones').select('*, familias(nombre)').order('hora_inicio', {ascending:true, nullsFirst:false}),
      sb.from('ninieras').select('nombre,tipo'),
    ]);
    if(error){ box.innerHTML = errBox(error); return; }
    const tipoPorNinera = {};
    (ninTipos||[]).forEach(n=>{ tipoPorNinera[normaliza(n.nombre)] = n.tipo || 'Niñera'; });
    const hoy = diaHoy();
    agendaItems = (data||[]).filter(a => Array.isArray(a.dias) && a.dias.includes(hoy));
    if(!agendaItems.length){
      box.innerHTML = '<div class="empty">No hay niñeras agendadas para hoy — cargá los horarios en Familias.</div>';
    } else {
      const ahora = new Date();
      const minAhora = ahora.getHours()*60 + ahora.getMinutes();
      const minDe = (hhmm) => { if(!hhmm) return null; const [h,m] = hhmm.split(':').map(Number); return h*60+m; };
      let nowInsertado = false;
      const filas = agendaItems.map(a=>{
        const esTraslado = tipoPorNinera[normaliza(a.ninera_nombre)] === 'Traslados';
        const horario = a.hora_inicio ? `${a.hora_inicio.slice(0,5)}${a.hora_fin?'–'+a.hora_fin.slice(0,5):''}` : 'Sin horario';
        const finMin = minDe(a.hora_fin) ?? minDe(a.hora_inicio);
        const yaPaso = finMin !== null && finMin < minAhora;
        let nowMarker = '';
        const inicioMin = minDe(a.hora_inicio);
        if(!nowInsertado && inicioMin !== null && inicioMin >= minAhora){
          nowInsertado = true;
          const ahoraFmt = ahora.toLocaleTimeString('es-UY', {hour:'2-digit', minute:'2-digit'});
          nowMarker = `<div class="timeline-now"><div class="agendatime">${ahoraFmt}</div><div class="timeline-now-line"></div></div>`;
        }
        return `${nowMarker}
        <div class="agendarow ${yaPaso?'pasado':''}">
          <div class="agendatime">${horario}</div>
          <div class="agendaicon ${esTraslado?'traslado':'sitting'}">${esTraslado?ICONS.sittings:ICONS.ninieras}</div>
          <div class="agendabody">
            <div><b>${a.ninera_nombre}</b> con <b>${a.familias?.nombre || 'familia sin nombre'}</b></div>
            <div class="agendatype">${esTraslado?'Traslado':'Sitting'}</div>
          </div>
        </div>`;
      });
      box.innerHTML = `<div class="timeline">${filas.join('')}${nowInsertado ? '' : `<div class="timeline-now"><div class="agendatime">${ahora.toLocaleTimeString('es-UY', {hour:'2-digit', minute:'2-digit'})}</div><div class="timeline-now-line"></div></div>`}</div>`;
    }
  }catch(e){ box.innerHTML = errBox(e); return; }

  try{
    const { data: registrosHoy } = await sb.from('sittings_traslados').select('familia_nombre,ninera_nombre').eq('fecha', todayISO());
    dashPendientesHoy = agendaItems.filter(a=>{
      const famN = normaliza(a.familias?.nombre||'');
      const ninN = normaliza(a.ninera_nombre||'');
      return !(registrosHoy||[]).some(r => normaliza(r.familia_nombre)===famN && normaliza(r.ninera_nombre)===ninN);
    });
    const el = document.getElementById('dash-pend-num');
    if(el) el.textContent = dashPendientesHoy.length;
  }catch(e){}
}

function renderPendHoy(cont){
  cont.innerHTML = `
    <button class="backbtn" onclick="setModulo(null)">← Volver</button>
    <h1 class="modtitle">Sittings/traslados de hoy sin registrar</h1>
    <div class="helper">Comparando la agenda de hoy (armada en Familias) contra lo que ya cargaste en Sittings &amp; traslados.</div>
    <div class="card">
      ${dashPendientesHoy.length ? dashPendientesHoy.map(a=>`

  `;
}

  const lbl = document.getElementById('fin-mes-label'); if(lbl) lbl.textContent = monthLabel(finMes);
  cargarFinanzas();
}

async function guardarGastoGeneral(){
  const fecha = document.getElementById('fin-gasto-fecha').value;
  const concepto = document.getElementById('fin-gasto-concepto').value.trim();
  const monto = Number(document.getElementById('fin-gasto-monto').value)||0;
  if(!fecha || !concepto || !monto){ toast('Faltan fecha, concepto o monto.', 'bad'); return; }
  const { error } = await sb.from('gastos_generales').insert({fecha, concepto, monto});
  if(error){ toast('No se pudo guardar: '+error.message, 'bad'); return; }
  cerrarModal();
  toast('Gasto agregado.');
  cargarFinanzas();
}
async function eliminarGastoGeneral(id){
  if(!(await confirmarAccion('¿Eliminar este gasto? No se puede deshacer.'))) return;
  const { error } = await sb.from('gastos_generales').delete().eq('id', id);
  if(error){ toast('No se pudo eliminar: '+error.message, 'bad'); return; }
  cargarFinanzas();
}

  const g = finGastosItems.find(x=>x.id===id);

      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>

}
async function guardarEdicionGasto(id){

async function cargarFinanzas(){
  const summary = document.getElementById('fin-summary');
  const movsBox = document.getElementById('fin-movs');
  movsBox.innerHTML = '<div class="empty"><span class="spinner dark"></span> Cargando…</div>';
  const [y,m] = finMes.split('-').map(Number);
  const desde = `${finMes}-01`;
  const hasta = new Date(y, m, 1).toISOString().slice(0,10);
  const [{data:sits, error:e1}, {data:gastos, error:e2}, {data:fijos, error:e3}] = await Promise.all([
    sb.from('sittings_traslados').select('*').gte('fecha', desde).lt('fecha', hasta),
    sb.from('gastos_generales').select('*').gte('fecha', desde).lt('fecha', hasta),
    sb.from('gastos_fijos').select('*').order('concepto'),
  ]);
  if(e1 || e2 || e3){ movsBox.innerHTML = errBox(e1||e2||e3); return; }
  finGastosItems = gastos || [];
  finFijosItems = fijos || [];
  const fijosDelMes = finFijosItems.filter(g => g.activo && g.desde && g.desde < hasta);
  const totalFijos = fijosDelMes.reduce((s,g)=>s+(Number(g.monto)||0), 0);
  const fijosList = document.getElementById('fin-fijos-list');
  if(fijosList){
    if(!finFijosItems.length){
      fijosList.innerHTML = '<div class="empty">Todavía no cargaste gastos fijos (suscripciones tipo Claude, Canva, etc.).</div>';
    } else {
      fijosList.innerHTML = finFijosItems.map(g=>{
        const aplicaEsteMes = g.activo && g.desde && g.desde < hasta;
        return `<div class="agendarow" style="border-bottom:1px solid var(--line);${g.activo?'':'opacity:.5;'}">
          <div>
            <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" ${g.activo?'checked':''} onchange="toggleGastoFijo('${g.id}', this.checked)">
              ${g.concepto} <span style="color:var(--ink-soft);font-size:12px;">· desde ${g.desde ? new Date(g.desde+'T00:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short',year:'numeric'}) : '—'}${aplicaEsteMes?'':' · no aplica este mes'}</span>
            </label>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">

        </div>`;
      }).join('') + (totalFijos>0 ? `<div class="helper" style="margin-top:8px;">Total fijos aplicados a ${monthLabel(finMes)}: <b>$${totalFijos.toLocaleString('es-UY')}</b></div>` : '');
    }
  }
  const ingresos = (sits||[]).reduce((s,r)=>s+(Number(r.cobro_familia)||0), 0);
  const egresosNinieras = (sits||[]).reduce((s,r)=>s+(Number(r.pago_ninera)||0), 0);
  const egresosGenerales = (gastos||[]).reduce((s,g)=>s+(Number(g.monto)||0), 0) + totalFijos;
  const egresos = egresosNinieras + egresosGenerales;
  summary.innerHTML = `
    <div class="summarycard"><div class="statlabel">Ingresos de ${monthLabel(finMes)}</div><div class="statnum" style="font-size:19px;margin-top:3px;color:var(--good);">$${ingresos.toLocaleString('es-UY')}</div></div>

  `;
  const chartCard = document.getElementById('fin-breakdown-card');

      if(finBreakdownChart){ finBreakdownChart.destroy(); finBreakdownChart = null; }
      finBreakdownChart = new Chart(document.getElementById('finBreakdownChart'), {
        type:'doughnut',
        data:{ labels:['Pagos a niñeras','Gastos generales'], datasets:[{ data:[Math.round(egresosNinieras), Math.round(egresosGenerales)], backgroundColor:['#757CBB','#DF8386'], borderWidth:0 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, cutout:'62%' }
      });
      document.getElementById('fin-breakdown-legend').innerHTML = `

        <span><span class="chartdot" style="background:#DF8386;"></span>Gastos generales · $${Math.round(egresosGenerales).toLocaleString('es-UY')}</span>`;
    } else {
      chartCard.style.display = 'none';
    }
  }
  const movs = [];
  (sits||[]).forEach(r=>{
    if(Number(r.cobro_familia)) movs.push({fecha:r.fecha, texto:`${r.familia_nombre} — ${r.tipo==='sitting'?'sitting':'traslado'} (${r.ninera_nombre})`, monto:Number(r.cobro_familia)});
    if(Number(r.pago_ninera)) movs.push({fecha:r.fecha, texto:`Pago a ${r.ninera_nombre}`, monto:-Number(r.pago_ninera)});
  });
  (gastos||[]).forEach(g=>{
    movs.push({fecha:g.fecha, texto:g.concepto, monto:-Number(g.monto), gastoId:g.id});
  });
  movs.sort((a,b)=> b.fecha.localeCompare(a.fecha));
  if(!movs.length){ movsBox.innerHTML = `<div class="empty">No hay movimientos cargados en ${monthLabel(finMes)} todavía.</div>`; return; }
  movsBox.innerHTML = `<h2>Movimientos de ${monthLabel(finMes)}</h2>` + movs.map(mv=>{
    const fechaFmt = new Date(mv.fecha+'T00:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short'});
    return `<div class="agendarow" style="border-bottom:1px solid var(--line);">
      <div>${fechaFmt} · ${mv.texto}</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:${mv.monto>0?'var(--good)':'var(--clay-text)'};">${mv.monto>0?'+':''}$${mv.monto.toLocaleString('es-UY')}</span>
        ${mv.gastoId ? `<button class="smallbtn" onclick="editarGastoGeneral('${mv.gastoId}')">Editar</button><button class="smallbtn danger" onclick="eliminarGastoGeneral('${mv.gastoId}')">Eliminar</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function moduloHeader(titulo){
  return `<h1 class="modtitle">${titulo}</h1>`;
}
function renderModulo(){
  renderSidebar();
  document.getElementById('modfooter').innerHTML = '';
  const cont = document.getElementById('modcontent');
  if(!moduloActivo){ renderDashboard(cont); return; }
  if(moduloActivo.startsWith('pend-')){ renderPendHoy(cont); return; }
  const m = MODULOS.find(x=>x.key===moduloActivo);
  if(moduloActivo==='rrhh'){ cont.innerHTML = moduloHeader(m.label) + rrhhShell(); afterRrhhRender(); return; }
  if(moduloActivo==='ninieras'){ cont.innerHTML = moduloHeader(m.label) + '<div id="ninieras-body"></div>'; renderNinieras(document.getElementById('ninieras-body')); return; }
  if(moduloActivo==='familias'){ cont.innerHTML = moduloHeader(m.label) + '<div id="fam-body"></div>'; renderFamilias(document.getElementById('fam-body')); return; }
  if(moduloActivo==='finanzas'){ renderFinanzas(cont); return; }
  if(moduloActivo==='sittings'){ cont.innerHTML = moduloHeader(m.label) + '<div id="sit-body"></div>'; renderSittings(document.getElementById('sit-body')); return; }
  if(moduloActivo==='marketing'){ renderMarketing(cont); return; }
  if(moduloActivo==='legal'){ renderLegal(cont); return; }
}

function onLegTipoChange(){ /* placeholder por si más adelante autocompleta tarifa según asignación */ }
function generarContrato(){
  const tipo = document.getElementById('leg-tipo').value;
  const nombre = document.getElementById('leg-nombre').value.trim() || '[nombre]';
  const cedula = document.getElementById('leg-cedula').value.trim() || '[cédula]';
  const domicilio = document.getElementById('leg-domicilio').value.trim() || '[domicilio]';
  const tarifa = document.getElementById('leg-tarifa').value || '[tarifa]';
  const frecuencia = document.getElementById('leg-frecuencia').value.trim() || '[frecuencia]';
  const fecha = document.getElementById('leg-fecha').value || '[fecha]';
  const fechaFmt = fecha!=='[fecha]' ? new Date(fecha+'T00:00:00').toLocaleDateString('es-UY') : fecha;
  const tpl = CONTRATO_TEMPLATES[tipo];
  const texto = tpl.texto
    .replace(/{{NOMBRE}}/g, nombre)
    .replace(/{{CEDULA}}/g, cedula)
    .replace(/{{DOMICILIO}}/g, domicilio)
    .replace(/{{TARIFA_HORA}}/g, tarifa)
    .replace(/{{FRECUENCIA_PAGO}}/g, frecuencia)
    .replace(/{{FECHA}}/g, fechaFmt);
  document.getElementById('leg-resultado').innerHTML = `
    <h2 class="card-section-title">${tpl.titulo} — ${nombre}</h2>
    <textarea id="leg-texto-generado" readonly style="min-height:320px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;">${texto}</textarea>
    <div class="actions">
      <button class="btn primary" onclick="copiarContrato()">Copiar texto</button>
      <button class="btn ghost" onclick="descargarContrato('${tipo}','${nombre.replace(/'/g,"")}')">Descargar .txt</button>
    </div>
  `;
}
async function copiarContrato(){
  const ta = document.getElementById('leg-texto-generado');
  try{ await navigator.clipboard.writeText(ta.value); toast('Contrato copiado.'); }
  catch(e){ ta.select(); toast('No se pudo copiar automático, seleccioná y copiá a mano.', 'bad'); }
}
function descargarContrato(tipo, nombre){
  const ta = document.getElementById('leg-texto-generado');
  const blob = new Blob([ta.value], {type:'text/plain;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `contrato_${tipo}_${nombre.replace(/\s+/g,'_')}.txt`; a.click(); URL.revokeObjectURL(url);
}
async function addContrato(){
  const tipo = document.getElementById('leg-reg-tipo').value;
  const parte_nombre = document.getElementById('leg-reg-nombre').value.trim();
  const fecha = document.getElementById('leg-reg-fecha').value || null;
  if(!parte_nombre){ toast('Falta el nombre.', 'bad'); return; }
  const { error } = await sb.from('contratos').insert({tipo, parte_nombre, fecha, estado:'borrador'});
  if(error){ toast('No se pudo guardar: '+error.message, 'bad'); return; }
  document.getElementById('leg-reg-nombre').value = '';
  toast('Agregado al registro.');
  cargarContratos();
}
async function cargarContratos(){
  const cont = document.getElementById('leg-lista');
  const { data, error } = await sb.from('contratos').select('*').order('created_at', {ascending:false});
  if(error){ cont.innerHTML = errBox(error); return; }
  contratosItems = data || [];
  if(!contratosItems.length){ cont.innerHTML = '<div class="empty">Todavía no hay contratos en el registro.</div>'; return; }
  const estColor = {borrador:'var(--ink-soft)', enviado:'var(--accent)', firmado:'var(--good)'};
  cont.innerHTML = `<div class="tablewrap"><table class="asigtable"><thead><tr><th>Tipo</th><th>Nombre</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>
    ${contratosItems.map(c=>`<tr>
      <td>${c.tipo==='ninera'?'Niñera':'Traslados'}</td>
      <td>${c.parte_nombre}</td>
      <td>${c.fecha ? new Date(c.fecha+'T00:00:00').toLocaleDateString('es-UY') : '—'}</td>
      <td><select onchange="cambiarEstadoContrato('${c.id}', this.value)" style="color:${estColor[c.estado]};font-weight:600;border:1px solid var(--line);border-radius:7px;padding:4px 8px;">
        <option value="borrador" ${c.estado==='borrador'?'selected':''}>Borrador</option>
        <option value="enviado" ${c.estado==='enviado'?'selected':''}>Enviado</option>
        <option value="firmado" ${c.estado==='firmado'?'selected':''}>Firmado</option>
      </select></td>
      <td><button class="smallbtn danger" onclick="eliminarContrato('${c.id}')">Eliminar</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;
}
async function cambiarEstadoContrato(id, estado){
  const { error } = await sb.from('contratos').update({estado}).eq('id', id);
  if(error){ toast('No se pudo actualizar: '+error.message, 'bad'); return; }
  toast('Estado actualizado.');
  cargarContratos();
}
async function eliminarContrato(id){
  if(!(await confirmarAccion('¿Eliminar este contrato del registro? No se puede deshacer.'))) return;
  const { error } = await sb.from('contratos').delete().eq('id', id);
  if(error){ toast('No se pudo eliminar: '+error.message, 'bad'); return; }
  toast('Eliminado.');
  cargarContratos();
}

async function cargarMarketing(){
  const cont = document.getElementById('mk-list');
  cont.innerHTML = '<div class="empty"><span class="spinner dark"></span> Cargando…</div>';
  const { data, error } = await sb.from('fechas_marketing').select('*').order('fecha');
  if(error){ cont.innerHTML = errBox(error); return; }
  marketingItems = data || [];
  if(!marketingItems.length){ cont.innerHTML = '<div class="empty">Todavía no hay fechas cargadas.</div>'; return; }
  const hoy = todayISO();
  const proximas = marketingItems.filter(f=>f.fecha >= hoy);
  const pasadas = marketingItems.filter(f=>f.fecha < hoy).reverse();
  const filaHTML = (f)=>{
    const fechaFmt = new Date(f.fecha+'T00:00:00').toLocaleDateString('es-UY', {day:'2-digit', month:'long', year:'numeric'});
    return `<div class="card" style="${f.publicado?'opacity:.6;':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>

          <h2 style="margin:0;">${f.titulo}</h2>
        </div>
        <label class="chk" style="font-size:12.5px;">
          <input type="checkbox" onchange="togglePublicadoMarketing('${f.id}', this.checked)" ${f.publicado?'checked':''}> Publicado
        </label>
      </div>
      ${f.sugerencia?`<div class="helper" style="margin-top:8px;">${f.sugerencia}</div>`:''}
      ${f.notas?`<div class="helper">${f.notas}</div>`:''}
      <div class="actions" style="margin-top:10px;"><button class="smallbtn" onclick="editarFechaMarketing('${f.id}')">Editar</button><button class="smallbtn danger" onclick="eliminarFechaMarketing('${f.id}')">Eliminar</button></div>
    </div>`;
  };
  let html = '';
  if(proximas.length){ html += `<div class="card-section-title">Próximas</div>` + proximas.map(filaHTML).join(''); }
  if(pasadas.length){ html += `<div class="card-section-title">Pasadas</div>` + pasadas.map(filaHTML).join(''); }
  cont.innerHTML = html;
}

function calcular(){
  const scores = COMPETENCIAS.map(c => entrevistaState.competencias[c.key]?.score).filter(v=>v!==undefined);
  const completo = scores.length === COMPETENCIAS.length;
  const total = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const criticoMarcado = REDFLAGS.some(f=>f.critico && entrevistaState.redflags[f.key]);
  let badgeClass='warn', badgeTexto='Faltan puntajes', nota='Completá los bloques de arriba para tener una recomendación.';
  if(completo){
    if(criticoMarcado){ badgeClass='warn'; badgeTexto='Con reservas'; nota='Hay una señal de alerta crítica marcada — revisar antes de avanzar.'; }
    else if(total>=4.2){ badgeClass='good'; badgeTexto='Recomendada'; nota='Puntaje sólido y sin señales críticas.'; }
    else if(total>=3){ badgeClass='warn'; badgeTexto='Con reservas'; nota='Puntaje intermedio — conviene una segunda charla.'; }
    else { badgeClass='bad'; badgeTexto='No recomendada'; nota='Puntaje bajo en varias competencias.'; }
  }
  const gaugeColor = badgeClass==='good'?'var(--good)':badgeClass==='bad'?'var(--bad)':'var(--warn)';
  const pct = completo?(total/5*100):0;
  const box = document.getElementById('resultado');
  box.style.display='flex';
  box.innerHTML = `<div class="gauge" style="background:conic-gradient(${gaugeColor} ${pct}%, var(--line) 0);"><div class="inner"><div class="num">${completo?total.toFixed(1):'—'}</div><div class="max">/ 5</div></div></div>
    <div><span class="badge ${badgeClass}">${badgeTexto}</span><div class="resultnote">${nota}</div></div>`;
  document.getElementById('btnGuardar').disabled = !completo;
  return {total, completo, recomendacion:badgeTexto};
}

function descargarCSV(headers, rows, filename){
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}

async function cargarNinieras(){
  const { data, error } = await sb.from('ninieras').select('*, candidatas(*)').eq('activa', true).order('nombre');
  if(error){ document.getElementById('ninierasgrid').innerHTML = errBox(error); return; }
  ninierasItems = data;
  // llenar desplegable de zonas: una niñera puede cubrir varias zonas separadas por "/" —
  // cada zona individual entra como su propia opción, agrupando variantes de mayúsculas/tildes
  const zonaSel = document.getElementById('filt-zona');
  if(zonaSel){
    const zonaMap = new Map();
    ninierasItems.forEach(n=>{

        if(!zonaMap.has(key)) zonaMap.set(key, raw);
      });
    });
    const zonas = [...zonaMap.entries()].sort((a,b)=>a[1].localeCompare(b[1]));
    zonaSel.innerHTML = `<option value="">Todas las zonas</option>` + zonas.map(([key,label])=>`<option value="${key}">${label}</option>`).join('');
  }

function filtrarNinieras(){
  const grid = document.getElementById('ninierasgrid');
  if(!grid) return;
  const fn = normaliza(document.getElementById('filt-nombre')?.value||'');
  const fz = document.getElementById('filt-zona')?.value||'';
  const ft = document.getElementById('filt-tipo')?.value||'';
  const filtradas = ninierasItems.filter(n => {
    const cd = n.candidatas || {};
    const blob = normaliza([n.nombre, n.notas, cd.universidad, cd.idiomas, cd.experiencia].filter(Boolean).join(' '));
    const matchTexto = !fn || blob.includes(fn);
    const matchZona = !fz || zonasDe(n.zona).some(z=>normaliza(z)===fz);
    const matchTipo = !ft || (n.tipo||'Niñera')===ft;
    return matchTexto && matchZona && matchTipo;
  });

// Sección "Datos de carsitting" reutilizable: busca por nombre (sin importar tildes/mayúsculas)
// contra TODOS los registros de carsitting_datos, sin depender de si ya está en Niñeras o
// todavía en Candidatas — así aparece sola apenas ella manda el form, esté donde esté.
async function cargarCarsittingSeccion(nombre, boxId, tipo, mail){
  const box = document.getElementById(boxId);
  if(!box) return;
  const { data } = await sb.from('carsitting_datos').select('*').order('created_at', {ascending:false});
  const nombreNorm = normaliza(nombre);
  const c = (data||[]).find(r=>normaliza(r.ninera_nombre)===nombreNorm);
  if(c){
    const campos = [
      ['Auto', [c.modelo_auto, c.color_auto].filter(Boolean).join(' · ')],
      ['Padrón / Matrícula', [c.padron, c.matricula].filter(Boolean).join(' · ')],
      ['Año de fabricación', c.anio_fabricacion],
      ['Asientos / Cinturones', [c.cantidad_asientos, c.cantidad_cinturones].filter(Boolean).join(' / ')],
      ['Seguro', [c.compania_seguro, c.tipo_seguro].filter(Boolean).join(' · ')],
      ['Licencia de conducir', [c.numero_licencia, c.anio_licencia?'obtenida '+c.anio_licencia:''].filter(Boolean).join(' · ')],
      ['Libreta de propiedad', c.libreta_propiedad],
      ['Cédula', c.cedula],
    ].filter(([,v])=>v);
    const fotos = [['Foto licencia', c.foto_licencia_url], ['Foto libreta', c.foto_libreta_url], ['Foto asientos', c.foto_asientos_url]].filter(([,v])=>v);
    box.innerHTML = `
      <div style="margin-top:14px;">
        <h2 class="card-section-title" style="margin-top:0;">Datos de carsitting</h2>
        <div class="fichadl">${campos.map(([l,v])=>`<div><b>${l}</b>${v}</div>`).join('')}</div>
        ${fotos.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">${fotos.map(([l,v])=>`<a href="${v}" target="_blank" class="smallbtn">${l}</a>`).join('')}</div>`:''}
      </div>`;
    return;
  }
  // todavía no completó el form -- si hace traslados, ofrecemos mandarle el mail ya armado
  if(tipo==='Traslados' || tipo==='Ambas'){
    const primerNombre = (nombre||'').split(' ')[0];
    const asunto = encodeURIComponent('¡Bienvenida al equipo de traslados de Parents Break!');
    const cuerpo = encodeURIComponent(`Hola ${primerNombre},\n\n¡Qué alegría contar con vos para hacer traslados con Parents Break! Ya vimos en tu entrevista que tenés licencia de conducir y ganas de sumarte a esta parte del equipo.\n\nPara terminar de darte de alta como carsitter, necesitamos que completes este formulario con los datos de tu auto y algunos datos más:\n\nhttps://forms.gle/J4QXgNJQ8kXMsA4C6\n\nCon esto ya vas a quedar lista para que te empecemos a asignar traslados.\n\nCualquier duda, escribinos.\n\nUn abrazo,\nParents Break`);
    const href = `mailto:${mail||''}?subject=${asunto}&body=${cuerpo}`;
    box.innerHTML = `
      <div style="margin-top:14px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="font-size:13px;color:var(--ink);">Hace traslados pero todavía no completó el form de carsitting.</div>
        <a class="btn primary" style="padding:7px 14px;font-size:12.5px;text-decoration:none;" href="${href}">Enviar mail de carsitting</a>
      </div>`;
  }
}

      if(!raw) return;
      const key = normaliza(raw);
      if(!famMap.has(key)) famMap.set(key, raw);
    });
    const fams = [...famMap.entries()].sort((a,b)=>a[1].localeCompare(b[1]));

let nineraHistItems = [];
function renderNineraHistorial(id){
  const cont = document.getElementById('vn-historial');
  if(!cont) return;
  const famF = document.getElementById('vn-familia')?.value||'';
  const periodo = parseInt(document.getElementById('vn-periodo')?.value||'0');
  let items = nineraHistItems.slice();
  if(famF) items = items.filter(s=>normaliza(s.familia_nombre)===famF);
  if(periodo>0){
    const limite = new Date(); limite.setDate(limite.getDate()-periodo);
    const limiteISO = limite.toISOString().slice(0,10);
    items = items.filter(s=>s.fecha && s.fecha >= limiteISO);
  }
  if(!items.length){ cont.innerHTML = '<div class="empty">No hay sittings registrados con estos filtros.</div>'; return; }
  const totalPago = items.reduce((s,r)=>s+(Number(r.pago_ninera)||0),0);
  cont.innerHTML = `
    <div class="helper" style="margin:8px 0;">${items.length} registro(s) · total pagado a la niñera: $${totalPago.toLocaleString('es-UY')}</div>

    }).join('')}</tbody></table></div>`;
}

let famResenaPorNinera = {};
let famHistorialPorFamilia = {};
async function cargarFamilias(){
  const cont = document.getElementById('familiaslist');
  cont.innerHTML = '<div class="empty"><span class="spinner dark"></span> Cargando…</div>';
  const { data: familias, error } = await sb.from('familias').select('*').order('nombre');
  if(error){ cont.innerHTML = errBox(error); return; }
  const [{data:asignaciones}, {data:sittings}, {data:resenas}] = await Promise.all([
    sb.from('asignaciones').select('*'),
    sb.from('sittings_traslados').select('familia_nombre,ninera_nombre'),
    sb.from('resenas_ninieras').select('ninera_nombre,puntuacion'),
  ]);
  famResenaPorNinera = {};
  (resenas||[]).forEach(r=>{
    if(r.puntuacion==null) return;
    const k = normaliza(r.ninera_nombre||'');
    if(!k) return;
    if(!famResenaPorNinera[k]) famResenaPorNinera[k] = {suma:0, cant:0};
    famResenaPorNinera[k].suma += Number(r.puntuacion);
    famResenaPorNinera[k].cant += 1;
  });
  famHistorialPorFamilia = {};
  (sittings||[]).forEach(s=>{
    const kf = normaliza(s.familia_nombre||'');
    const kn = s.ninera_nombre;
    if(!kf || !kn) return;
    if(!famHistorialPorFamilia[kf]) famHistorialPorFamilia[kf] = {};
    famHistorialPorFamilia[kf][kn] = (famHistorialPorFamilia[kf][kn]||0) + 1;
  });
  familiasItems = familias.map(f => ({...f, asignaciones: (asignaciones||[]).filter(a=>a.familia_id===f.id)}));
  if(!ninierasItems.length){ try{ const r = await sb.from('ninieras').select('nombre'); ninierasItems = r.data||ninierasItems; }catch(e){} }
  // llenar el filtro de zonas agrupando variantes de mayúsculas/tildes/espacios como la misma zona
  const zonaSel = document.getElementById('fam-zonafiltro');
  if(zonaSel){
    const zonaMap = new Map();
    familiasItems.forEach(f=>{
      zonasDe(f.zona).forEach(raw=>{
        const key = normaliza(raw);
        if(!zonaMap.has(key)) zonaMap.set(key, raw);
      });
    });
    const zonas = [...zonaMap.entries()].sort((a,b)=>a[1].localeCompare(b[1]));
    zonaSel.innerHTML = `<option value="">Todas las zonas</option>` + zonas.map(([key,label])=>`<option value="${key}" ${famZonaFiltro===key?'selected':''}>${label}</option>`).join('');
  }
  renderFamiliasList();
  if(famDetalleAbierta){
    if(familiasItems.some(f=>f.id===famDetalleAbierta)) verFamilia(famDetalleAbierta);
    else { famDetalleAbierta = null; cerrarModal(); }
  }
}
function renderFamiliasList(){
  const cont = document.getElementById('familiaslist');
  if(!cont) return;
  if(!familiasItems.length){ cont.innerHTML='<div class="empty">Todavía no hay familias cargadas.</div>'; return; }
  const q = normaliza(famBusqueda);
  const filtradas = familiasItems.filter(f=>{
    const matchNombre = !q || normaliza(f.nombre).includes(q);
    const matchZona = !famZonaFiltro || zonasDe(f.zona).some(z=>normaliza(z)===famZonaFiltro);
    return matchNombre && matchZona;
  });
  const countMsg = `<div class="helper" style="margin:0 0 8px;">${filtradas.length} de ${familiasItems.length} familias</div>`;

  cont.innerHTML = countMsg + '<div class="person-list">' + filtradas.map(f=>{
    const margenFam = (Number(f.cobro_hora)||0) - (Number(f.pago_hora)||0);

    const badge = tieneTarifa
      ? `<span class="badge ${margenFam>=0?'good':'bad'}" style="font-size:10px;padding:2px 8px;">$${f.cobro_hora||0}/h</span>`
      : `<span class="badge warn" style="font-size:10px;padding:2px 8px;">Sin tarifa</span>`;

}

async function guardarEdicionFamilia(id){

async function addAsignacion(famId){

  const dias = Array.from(document.querySelectorAll(`#asig-dias-${famId} .daybtn.selected`)).map(b=>b.textContent);
  const asig = { familia_id:famId, ninera_nombre:nombre, dias,
    hora_inicio:document.getElementById('asig-horaini-'+famId).value||null, hora_fin:document.getElementById('asig-horafin-'+famId).value||null };
  const { error } = await sb.from('asignaciones').insert(asig);
  if(error){ toast('No se pudo agregar: '+error.message,'bad'); return; }
  toast('Niñera asignada.');
  cargarFamilias();

async function quitarAsignacion(id){
  const { error } = await sb.from('asignaciones').delete().eq('id', id);
  if(error){ toast('No se pudo quitar: '+error.message,'bad'); return; }
  cargarFamilias();
}
async function eliminarFamilia(id){
  if(!(await confirmarAccion('¿Eliminar esta familia? No se puede deshacer.'))) return;
  const { error } = await sb.from('familias').delete().eq('id', id);

  if(famDetalleAbierta===id){ famDetalleAbierta=null; cerrarModal(); }

function currentMonthStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function shiftMes(mesStr, delta){ const [y,m] = mesStr.split('-').map(Number); const d = new Date(y, m-1+delta, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthLabel(mesStr){
  const [y,m] = mesStr.split('-').map(Number);
  const f = new Intl.DateTimeFormat('es-UY', {month:'long', year:'numeric'}).format(new Date(y, m-1, 1));
  return f.charAt(0).toUpperCase() + f.slice(1);
}

let sitHistItems = [];
async function cargarSitHistorial(){
  const [{data:todos}, {data:resenas}] = await Promise.all([
    sb.from('sittings_traslados').select('*').order('fecha', {ascending:false}),
    sb.from('resenas_ninieras').select('ninera_nombre,puntuacion'),
  ]);
  sitHistItems = todos || [];
  sitHistResenas = {};
  (resenas||[]).forEach(r=>{
    if(r.puntuacion==null) return;
    const k = normaliza(r.ninera_nombre||'');
    if(!k) return;
    if(!sitHistResenas[k]) sitHistResenas[k] = {suma:0, cant:0};
    sitHistResenas[k].suma += Number(r.puntuacion);
    sitHistResenas[k].cant += 1;
  });
  // llenar desplegable de familias agrupando variantes de mayúsculas/tildes/espacios como la misma familia
  const sel = document.getElementById('sithist-familia');
  if(sel){
    const famMap = new Map();
    sitHistItems.forEach(s=>{
      const raw = (s.familia_nombre||'').trim();
      if(!raw) return;
      const key = normaliza(raw);
      if(!famMap.has(key)) famMap.set(key, raw);
    });
    const fams = [...famMap.entries()].sort((a,b)=>a[1].localeCompare(b[1]));
    sel.innerHTML = `<option value="">Todas</option>` + fams.map(([key,label])=>`<option value="${key}">${label}</option>`).join('');
  }
  renderSitHistorial();
}
function resenaBadge(nineraNombre){
  const res = sitHistResenas[normaliza(nineraNombre||'')];
  if(!res) return '<span style="color:var(--ink-soft);">—</span>';
  const prom = (res.suma/res.cant).toFixed(1);
  const color = Number(prom)>=4 ? 'var(--good)' : Number(prom)>=3 ? '#7A5A16' : 'var(--clay-text)';
  return `<span style="font-weight:600;color:${color};">★ ${prom} (${res.cant})</span>`;
}
function renderSitHistorial(){
  const cont = document.getElementById('sithist-lista');
  if(!cont) return;
  const famF = document.getElementById('sithist-familia')?.value||'';
  const periodo = parseInt(document.getElementById('sithist-periodo')?.value||'0');
  const tipoF = document.getElementById('sithist-tipo')?.value||'';
  let items = sitHistItems.slice();
  if(famF) items = items.filter(s=>normaliza(s.familia_nombre)===famF);
  if(tipoF) items = items.filter(s=>s.tipo===tipoF);
  if(periodo>0){
    const limite = new Date(); limite.setDate(limite.getDate()-periodo);
    const limiteISO = limite.toISOString().slice(0,10);
    items = items.filter(s=>s.fecha && s.fecha >= limiteISO);
  }
  if(!items.length){ cont.innerHTML = '<div class="empty">No hay registros que coincidan con estos filtros.</div>'; return; }
  const totalCobro = items.reduce((s,r)=>s+(Number(r.cobro_familia)||0),0);
  const totalPago = items.reduce((s,r)=>s+(Number(r.pago_ninera)||0),0);
  cont.innerHTML = `
    <div class="helper" style="margin:8px 0;">${items.length} registro(s) · cobrado $${totalCobro.toLocaleString('es-UY')} · pagado $${totalPago.toLocaleString('es-UY')}</div>
    <div class="tablewrap"><table class="asigtable"><thead><tr><th>Fecha</th><th>Niñera</th><th>Familia</th><th>Cobro</th><th>Pago</th><th>Reseña niñera</th></tr></thead>
    <tbody>${items.map(r=>{
      const fechaFmt = r.fecha ? new Date(r.fecha+'T00:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short'}) : '—';
      return `<tr><td>${fechaFmt}</td><td>${r.ninera_nombre}</td><td>${r.familia_nombre}</td><td>$${r.cobro_familia||0}</td><td>$${r.pago_ninera||0}</td><td>${resenaBadge(r.ninera_nombre)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

  sitFamiliaSel = findFamilia(val);
  const box = document.getElementById('sit-familia-create');
  box.innerHTML = (val && !sitFamiliaSel) ? `<button type="button" class="createbtn" onclick="crearFamiliaRapida()">+ Crear familia "${val}"</button>` : '';
  sitOrigenAuto = true;
  if(sitTipo==='traslado') aplicarDireccionSugerida();
  // Autocompletar cobro/pago desde la tarifa fija de la familia
  if(sitFamiliaSel && (sitFamiliaSel.cobro_hora!=null || sitFamiliaSel.pago_hora!=null)){
    const cobroInput = document.getElementById('sit-cobro');
    const pagoInput = document.getElementById('sit-pago');
    if(cobroInput && (!cobroInput.value || cobroInput.value==='0') && sitFamiliaSel.cobro_hora!=null) cobroInput.value = sitFamiliaSel.cobro_hora;
    if(pagoInput && (!pagoInput.value || pagoInput.value==='0') && sitFamiliaSel.pago_hora!=null) pagoInput.value = sitFamiliaSel.pago_hora;
    calcSitMargen();
  }
  actualizarTarifaExtra();
}
function onSitNineraInput(){
  const val = document.getElementById('sit-ninera').value.trim();
  sitNineraSel = findNinera(val);
  const box = document.getElementById('sit-ninera-create');
  box.innerHTML = (val && !sitNineraSel) ? `<button type="button" class="createbtn" onclick="crearNineraRapida()">+ Crear niñera "${val}"</button>` : '';
  actualizarTarifaExtra();
}
async function crearFamiliaRapida(){
  const val = document.getElementById('sit-familia').value.trim();
  if(!val) return;
  const { data, error } = await sb.from('familias').insert({nombre:val}).select().single();
  if(error){ toast('No se pudo crear la familia: '+error.message, 'bad'); return; }
  sitFamilias.push(data);
  sitFamiliaSel = data;
  document.getElementById('sit-familia-create').innerHTML = '<div style="font-size:11.5px;color:var(--good);font-weight:600;">Familia creada.</div>';
  const dl = document.getElementById('sit-familias-dl'); if(dl) dl.insertAdjacentHTML('beforeend', `<option value="${data.nombre}">`);
  toast('Familia creada — le podés agregar zona, teléfono y dirección después desde Familias.');
}
async function crearNineraRapida(){
  const val = document.getElementById('sit-ninera').value.trim();
  if(!val) return;
  const { data, error } = await sb.from('ninieras').insert({nombre:val, activa:true}).select().single();
  if(error){ toast('No se pudo crear la niñera: '+error.message, 'bad'); return; }
  sitNinieras.push(data);
  sitNineraSel = data;
  document.getElementById('sit-ninera-create').innerHTML = '<div style="font-size:11.5px;color:var(--good);font-weight:600;">Niñera creada.</div>';
  const dl = document.getElementById('sit-ninieras-dl'); if(dl) dl.insertAdjacentHTML('beforeend', `<option value="${data.nombre}">`);
  toast('Niñera creada — le podés agregar zona y teléfono después desde Niñeras.');
}

/* ---- dirección sugerida para traslados ---- */
function aplicarDireccionSugerida(){
  const hint = document.getElementById('sit-addr-hint');
  const origenInput = document.getElementById('sit-origen');
  if(!hint || !origenInput) return;
  if(sitFamiliaSel && sitFamiliaSel.direccion && sitOrigenAuto){
    origenInput.value = sitFamiliaSel.direccion;
    hint.textContent = `Dirección sugerida desde la ficha de ${sitFamiliaSel.nombre} — la podés editar si el traslado arranca en otro lado.`;
    hint.style.display = 'block';
  } else {
    hint.style.display = 'none';
  }
}
function verRutaMaps(){
  const o = (document.getElementById('sit-origen')||{}).value?.trim();
  const d = (document.getElementById('sit-destino')||{}).value?.trim();
  if(!o || !d){ toast('Cargá origen y destino primero.', 'bad'); return; }
  window.open('https://www.google.com/maps/dir/'+encodeURIComponent(o)+'/'+encodeURIComponent(d), '_blank');
}

/* ---- horas / cobro extra ---- */
function toggleSitExtra(){
  const box = document.getElementById('sit-extra-box');
  const opening = box.style.display === 'none';
  box.style.display = opening ? 'block' : 'none';
  if(opening) actualizarTarifaExtra();
}
function extraManualHTML(msg){
  return `<div class="helper" style="margin:0 0 8px;">${msg}</div>
    <div class="grid2">
      <div class="field"><label>Extra cobro</label><input type="number" id="sit-extra-cobro-manual" value="0"></div>
      <div class="field"><label>Extra pago</label><input type="number" id="sit-extra-pago-manual" value="0"></div>
    </div>
    <button type="button" class="smallbtn" onclick="aplicarExtraManual()">Sumar extra</button>`;
}
function actualizarTarifaExtra(){
  const box = document.getElementById('sit-extra-box');
  if(!box || box.style.display==='none') return;
  if(!sitFamiliaSel){
    box.innerHTML = extraManualHTML('Elegí una familia ya cargada para calcular el extra según su tarifa, o cargalo a mano.');
    return;
  }
  const cobroH = Number(sitFamiliaSel.cobro_hora)||0;
  const pagoH = Number(sitFamiliaSel.pago_hora)||0;
  if(cobroH || pagoH){
    box.innerHTML = `
      <div class="helper" style="margin:0 0 6px;">Tarifa de ${sitFamiliaSel.nombre}: $${cobroH}/h cobro · $${pagoH}/h pago</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${[30,60,90,120].map(min=>`<button type="button" class="durbtn" onclick="aplicarExtraHoras(${min}, ${cobroH}, ${pagoH})">${min<60 ? min+' min' : (min/60)+' h'}</button>`).join('')}
      </div>
      <div id="sit-extra-result" style="font-size:12.5px;margin-top:8px;color:var(--ink-soft);"></div>`;
  } else {
    box.innerHTML = extraManualHTML('Esta familia no tiene tarifa por hora cargada (ponela en Familias) — cargá el extra a mano.');
  }
}
function aplicarExtraHoras(min, tarifaCobro, tarifaPago){
  const horas = min/60;
  const extraCobro = Math.round(tarifaCobro*horas);
  const extraPago = Math.round(tarifaPago*horas);
  const cobroInput = document.getElementById('sit-cobro');
  const pagoInput = document.getElementById('sit-pago');
  cobroInput.value = (Number(cobroInput.value)||0) + extraCobro;
  pagoInput.value = (Number(pagoInput.value)||0) + extraPago;
  const res = document.getElementById('sit-extra-result');
  if(res) res.textContent = `+${min<60 ? min+' min' : (min/60)+' h'} → +$${extraCobro} cobro, +$${extraPago} pago (ya sumado arriba)`;
  calcSitMargen();
}
function aplicarExtraManual(){
  const ec = Number(document.getElementById('sit-extra-cobro-manual').value)||0;
  const ep = Number(document.getElementById('sit-extra-pago-manual').value)||0;
  const cobroInput = document.getElementById('sit-cobro');
  const pagoInput = document.getElementById('sit-pago');
  cobroInput.value = (Number(cobroInput.value)||0) + ec;
  pagoInput.value = (Number(pagoInput.value)||0) + ep;
  toast('Extra sumado al cobro y al pago.');
  calcSitMargen();
}
function calcSitMargen(){
  const c = Number((document.getElementById('sit-cobro')||{}).value)||0;
  const p = Number((document.getElementById('sit-pago')||{}).value)||0;
  const el = document.getElementById('sit-margen');
  if(el) el.textContent = '$'+(c-p);
}

/* ---- guardar / editar / eliminar ---- */
async function guardarSitting(){
  const familiaNombre = document.getElementById('sit-familia').value.trim();
  const nineraNombre = document.getElementById('sit-ninera').value.trim();
  const fecha = document.getElementById('sit-fecha').value;
  if(!familiaNombre || !nineraNombre || !fecha){ toast('Faltan familia, niñera o fecha.', 'bad'); return; }
  const registro = {
    tipo: sitTipo,
    registrado_por: document.getElementById('sit-registro').value,
    familia_id: sitFamiliaSel ? sitFamiliaSel.id : null,
    familia_nombre: familiaNombre,
    ninera_id: sitNineraSel ? sitNineraSel.id : null,
    ninera_nombre: nineraNombre,
    fecha,
    cobro_familia: Number(document.getElementById('sit-cobro').value)||0,
    pago_ninera: Number(document.getElementById('sit-pago').value)||0,
    notas: document.getElementById('sit-notas').value || null,
    hora_inicio: null, hora_fin: null, km: null, origen: null, destino: null,
  };
  if(sitTipo==='sitting'){
    registro.hora_inicio = document.getElementById('sit-horaini').value || null;
    registro.hora_fin = document.getElementById('sit-horafin').value || null;
  } else {
    const km = document.getElementById('sit-km').value;
    registro.km = km ? Number(km) : null;
    registro.origen = document.getElementById('sit-origen').value || null;
    registro.destino = document.getElementById('sit-destino').value || null;
  }
  let error;
  if(sitEditId){
    ({ error } = await sb.from('sittings_traslados').update(registro).eq('id', sitEditId));
  } else {
    ({ error } = await sb.from('sittings_traslados').insert(registro));
  }
  if(error){ toast('No se pudo guardar: '+error.message, 'bad'); return; }
  toast(sitEditId ? 'Registro actualizado.' : 'Registro guardado.');
  sitEditId = null; sitFamiliaSel = null; sitNineraSel = null; sitOrigenAuto = true; sitTipo = 'sitting';
  renderSitForm();
  cerrarModal();
  cargarSitLista();
}
function cancelarEdicionSitting(){
  sitEditId = null; sitFamiliaSel = null; sitNineraSel = null; sitOrigenAuto = true; sitTipo = 'sitting';
  renderSitForm();
  cerrarModal();
}
function editarSitting(id){
  const r = sitItems.find(x=>x.id===id);
  if(!r) return;
  sitEditId = id;
  sitTipo = r.tipo;
  sitFamiliaSel = sitFamilias.find(f=>f.id===r.familia_id) || findFamilia(r.familia_nombre);
  sitNineraSel = sitNinieras.find(n=>n.id===r.ninera_id) || findNinera(r.ninera_nombre);
  sitOrigenAuto = false;
  renderSitForm();
  setTimeout(()=>{
    document.getElementById('sit-familia').value = r.familia_nombre || '';
    document.getElementById('sit-ninera').value = r.ninera_nombre || '';
    document.getElementById('sit-registro').value = r.registrado_por || 'Paulina G';
    document.getElementById('sit-fecha').value = r.fecha || '';
    document.getElementById('sit-cobro').value = r.cobro_familia || 0;
    document.getElementById('sit-pago').value = r.pago_ninera || 0;
    document.getElementById('sit-notas').value = r.notas || '';
    if(r.tipo==='sitting'){
      if(document.getElementById('sit-horaini')) document.getElementById('sit-horaini').value = r.hora_inicio ? r.hora_inicio.slice(0,5) : '';
      if(document.getElementById('sit-horafin')) document.getElementById('sit-horafin').value = r.hora_fin ? r.hora_fin.slice(0,5) : '';
    } else {
      if(document.getElementById('sit-km')) document.getElementById('sit-km').value = r.km || '';
      if(document.getElementById('sit-origen')) document.getElementById('sit-origen').value = r.origen || '';
      if(document.getElementById('sit-destino')) document.getElementById('sit-destino').value = r.destino || '';
    }
    calcSitMargen();
    const wrap = document.getElementById('sit-form-wrap');
    if(wrap) abrirModalConNodo(wrap);
  }, 30);
}
async function eliminarSitting(id){
  if(!(await confirmarAccion('¿Eliminar este registro? No se puede deshacer.'))) return;
  const { error } = await sb.from('sittings_traslados').delete().eq('id', id);
  if(error){ toast('No se pudo eliminar: '+error.message, 'bad'); return; }
  toast('Registro eliminado.');
  cargarSitLista();
}

/* ---- lista del mes / resumen / export ---- */
function cambiarSitMesRel(delta){
  sitMes = shiftMes(sitMes, delta);
  const lbl = document.getElementById('sit-mes-label'); if(lbl) lbl.textContent = monthLabel(sitMes);
  cargarSitLista();
}
async function cargarSitLista(){
  const wrap = document.getElementById('sit-list-wrap');
  const summary = document.getElementById('sit-summary');
  if(!wrap) return;
  wrap.innerHTML = '<div class="empty"><span class="spinner dark"></span> Cargando…</div>';
  const [y,m] = sitMes.split('-').map(Number);
  const desde = `${sitMes}-01`;
  const hasta = new Date(y, m, 1).toISOString().slice(0,10);
  const { data, error } = await sb.from('sittings_traslados').select('*').gte('fecha', desde).lt('fecha', hasta).order('fecha', {ascending:false});
  if(error){ wrap.innerHTML = errBox(error); return; }
  sitItems = data || [];
  const cobrado = sitItems.reduce((s,r)=>s+(Number(r.cobro_familia)||0), 0);
  const pagado = sitItems.reduce((s,r)=>s+(Number(r.pago_ninera)||0), 0);
  summary.innerHTML = `
    <div class="summarycard"><div class="statlabel">Cobrado en ${monthLabel(sitMes)}</div><div class="statnum" style="font-size:19px;margin-top:3px;">$${cobrado}</div></div>
    <div class="summarycard"><div class="statlabel">Pagado en ${monthLabel(sitMes)}</div><div class="statnum" style="font-size:19px;margin-top:3px;">$${pagado}</div></div>
    <div class="summarycard" style="border-left:3px solid var(--good);"><div class="statlabel">Margen</div><div class="statnum" style="font-size:19px;margin-top:3px;color:var(--good);">$${cobrado-pagado}</div></div>
  `;
  if(!sitItems.length){ wrap.innerHTML = `<div class="empty">No hay registros cargados en ${monthLabel(sitMes)} todavía.</div>`; return; }
  wrap.innerHTML = `
    <h2>Registros de ${monthLabel(sitMes)}</h2>
    <div class="tablewrap"><table class="asigtable"><thead><tr><th>Fecha</th><th>Tipo</th><th>Familia</th><th>Niñera</th><th>Cobro</th><th>Pago</th><th>Margen</th><th></th></tr></thead>
    <tbody>${sitItems.map(r=>{
      const margen = (Number(r.cobro_familia)||0) - (Number(r.pago_ninera)||0);
      const fechaFmt = r.fecha ? new Date(r.fecha+'T00:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short'}) : '—';
      return `<tr><td>${fechaFmt}</td><td><span class="badge ${r.tipo==='sitting'?'brand':'warn'}" style="font-size:10px;padding:2px 8px;">${r.tipo==='sitting'?'Sitting':'Traslado'}</span></td><td>${r.familia_nombre}</td><td>${r.ninera_nombre}</td><td>$${r.cobro_familia||0}</td><td>$${r.pago_ninera||0}</td><td class="${margen>=0?'margenpos':'margenneg'}">$${margen}</td><td><div class="tablecell-btns"><button class="smallbtn" onclick="editarSitting('${r.id}')">Editar</button><button class="smallbtn danger" onclick="eliminarSitting('${r.id}')">Eliminar</button></div></td></tr>`;
    }).join('')}</tbody></table></div>
  `;
}
function exportarSitCSV(){
  if(!sitItems.length){ toast('No hay registros para exportar en este mes.', 'bad'); return; }
  const headers = ['Fecha','Tipo','Registró','Familia','Niñera','Hora inicio','Hora fin','Km','Origen','Destino','Cobro familia','Pago niñera','Margen','Notas'];
  const rows = sitItems.map(r=>[r.fecha, r.tipo, r.registrado_por, r.familia_nombre, r.ninera_nombre, r.hora_inicio||'', r.hora_fin||'', r.km||'', r.origen||'', r.destino||'', r.cobro_familia||0, r.pago_ninera||0, (Number(r.cobro_familia)||0)-(Number(r.pago_ninera)||0), (r.notas||'').replace(/\n/g,' ')]);
  descargarCSV(headers, rows, `sittings_traslados_${sitMes}.csv`);
}

boot();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
