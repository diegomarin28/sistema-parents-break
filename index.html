<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Parents Break</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#757CBB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parents Break">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
:root{
  --bg:#F6F5FB; --paper:#FFFFFF; --ink:#312F45; --ink-soft:#6C6A84; --line:#E3E1EE;
  --accent:#757CBB; --accent-soft:#E7E8F5; --clay:#DF8386; --clay-soft:#FBE7E8; --clay-text:#B8555A;
  --good:#3E7D4F; --good-soft:#E3EFE3; --warn:#B9862E; --warn-soft:#F7EBD4; --bad:#AB4B41; --bad-soft:#F5E1DD;
  --shadow-sm: 0 1px 2px rgba(49,47,69,.05), 0 1px 4px rgba(49,47,69,.05);
  --shadow-md: 0 6px 20px rgba(49,47,69,.10);
  --ease: 180ms cubic-bezier(.4,0,.2,1);
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;}
.wrap{max-width:980px;margin:0 auto;padding:24px 20px 100px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);margin-bottom:6px;}
h1{font-size:27px;font-weight:600;}
.sub{color:var(--ink-soft);font-size:14px;margin-top:5px;max-width:640px;line-height:1.5;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.who{font-size:12.5px;color:var(--ink-soft);text-align:right;}
.who button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:12.5px;padding:0;margin-top:3px;}
.homeintro{margin:12px 0 28px;}
.homeintro h1{font-size:26px;margin-top:4px;}
.hometiles{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:130px;gap:16px;}
.tile{
  background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;
  text-align:left;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform var(--ease), box-shadow var(--ease), border-color var(--ease);
  display:flex;flex-direction:column;gap:10px;font-family:'Inter',sans-serif;position:relative;overflow:hidden;
  opacity:0;animation:tileIn 480ms cubic-bezier(.2,.8,.2,1) forwards;
}
.tile.hero{grid-column:span 2;grid-row:span 2;padding:30px;justify-content:flex-end;}
.tile.hero .tile-icon{width:56px;height:56px;border-radius:16px;}
.tile.hero .tile-icon svg{width:28px;height:28px;}
.tile.hero .tile-title{font-size:22px;}
.tile.hero .tile-desc{font-size:14px;max-width:320px;}
.tile.hero::after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:var(--tile-accent-soft);top:-90px;right:-90px;z-index:0;}
@keyframes tileIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--tile-accent);}
.tile-icon{width:46px;height:46px;border-radius:13px;background:var(--tile-accent-soft);color:var(--tile-accent);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
.tile-icon svg{width:23px;height:23px;}
.tile-title{font-family:'Baloo 2',sans-serif;font-size:17px;font-weight:700;color:var(--ink);position:relative;z-index:1;}
.tile-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;position:relative;z-index:1;}
.backbtn{background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;transition:all var(--ease);font-family:'Inter',sans-serif;}
.backbtn:hover{border-color:var(--accent);color:var(--accent);}
.modtitle{font-size:24px;margin:14px 0 20px;}
.subnav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 20px;flex-wrap:wrap;}
.subtab{font-weight:600;font-size:13.5px;color:var(--ink-soft);background:none;border:none;padding:9px 4px;cursor:pointer;border-bottom:2px solid transparent;margin-right:16px;font-family:'Inter',sans-serif;transition:color var(--ease), border-color var(--ease);}
.subtab:hover{color:var(--accent);}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent);}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm);animation:fadeIn var(--ease);}
.card h2{font-size:16.5px;font-weight:600;letter-spacing:-0.01em;}
.helper{color:var(--ink-soft);font-size:13px;margin:4px 0 12px;line-height:1.5;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);font-family:'Inter',sans-serif;
  transition:border-color var(--ease), box-shadow var(--ease);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
textarea{resize:vertical;min-height:54px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.field{margin-bottom:12px;}
.q{background:var(--accent-soft);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:13.5px;color:#2C4A38;line-height:1.45;}
.scorebar{display:flex;gap:6px;margin-top:10px;}
.scorebtn{flex:1;text-align:center;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);}
.scorebtn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
.scorelabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
.flag-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);}
.flag-row:last-child{border-bottom:none;}
.flag-row input{margin-top:3px;}
.flag-row span{font-size:13.5px;line-height:1.4;}
.flag-row.critical span::after{content:" · crítico";color:var(--bad);font-size:11px;font-weight:600;}
.refrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
.refrow .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);white-space:nowrap;}
.smallbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-family:'Inter',sans-serif;}
.smallbtn:hover{border-color:var(--accent);color:var(--accent);}
.smallbtn.danger:hover{border-color:var(--bad);color:var(--bad);}
.resultcard{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.gauge{width:88px;height:88px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.gauge .inner{width:68px;height:68px;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge .num{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:600;}
.gauge .max{font-size:10px;color:var(--ink-soft);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;font-size:12.5px;font-weight:700;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.badge.good{background:var(--good-soft);color:var(--good);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.bad{background:var(--bad-soft);color:var(--bad);}
.badge.brand{background:var(--clay-soft);color:var(--clay-text);}
.resultnote{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{font-weight:600;font-size:14px;border-radius:10px;padding:11px 20px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:transform var(--ease), box-shadow var(--ease), background var(--ease);}
.btn.primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
.btn.primary:hover:not(:disabled){background:#666EAE;box-shadow:var(--shadow-md);}
.btn.primary:active:not(:disabled){transform:scale(.98);}
.btn.primary:disabled{background:#C7C6DA;cursor:not-allowed;}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.warnbox{background:var(--warn-soft);border:1px solid #E4C888;border-radius:9px;padding:10px 13px;font-size:13px;color:#7A5A16;margin-top:14px;line-height:1.5;}
.okbox{background:var(--good-soft);border:1px solid #B9D9BE;border-radius:9px;padding:10px 13px;font-size:13px;color:var(--good);margin-top:14px;line-height:1.5;}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow-sm);transition:transform var(--ease), box-shadow var(--ease);}
.pcard .ph{width:100%;aspect-ratio:1;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:600;margin-bottom:10px;overflow:hidden;}
.pcard .ph img{width:100%;height:100%;object-fit:cover;}
.pcard .name{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:600;}
.pcard .meta{font-size:12.5px;color:var(--ink-soft);margin:3px 0 10px;line-height:1.5;}
.pcard .rowbtns{display:flex;gap:6px;flex-wrap:wrap;}
.empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:40px 0;}
.candlist .item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform var(--ease), box-shadow var(--ease), border-color var(--ease);}
.candlist .item:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.candlist .item .name{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:600;}
.candlist .item .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.candlist .item .sc{margin-left:auto;text-align:right;}
.candlist .item .sc .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}
.detailback{background:none;border:none;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;padding:0;margin-bottom:14px;}
.psico-img{width:100%;max-width:260px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;}
details.crit{margin-top:8px;font-size:13px;color:var(--ink-soft);}
details.crit summary{cursor:pointer;font-weight:600;color:var(--accent);}
details.crit ul{margin:8px 0 0;padding-left:18px;line-height:1.6;}
.importtable{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;}
.importtable th,.importtable td{border:1px solid var(--line);padding:5px 7px;text-align:left;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;}
.maprow{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;margin-bottom:8px;}
.placeholder{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.placeholder h2{font-size:19px;margin-bottom:8px;color:var(--ink);}
.placeholder p{max-width:440px;margin:0 auto;line-height:1.6;font-size:14px;}
.fichadl{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px;}
.fichadl div{padding:4px 0;border-bottom:1px dashed var(--line);}
.fichadl b{color:var(--ink-soft);font-weight:600;display:block;font-size:11px;text-transform:uppercase;letter-spacing:.02em;}
.asigtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
.asigtable th,.asigtable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;}
.margenpos{color:var(--good);font-weight:600;}
.margenneg{color:var(--bad);font-weight:600;}
.loginstage{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);}
.loginbrand{position:relative;overflow:hidden;background:var(--accent);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:60px;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:drift 20s ease-in-out infinite;}
.blob-a{width:380px;height:380px;background:var(--clay);top:-100px;right:-80px;animation-duration:22s;}
.blob-b{width:320px;height:320px;background:#fff;bottom:-120px;left:-60px;opacity:.16;animation-duration:26s;animation-delay:-6s;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-20px) scale(1.06);}66%{transform:translate(-20px,25px) scale(0.96);}}
.loginbrand-logo{height:44px;filter:brightness(0) invert(1);position:relative;z-index:1;margin-bottom:28px;animation:logoIn 600ms cubic-bezier(.2,.8,.2,1);}
@keyframes logoIn{from{opacity:0;transform:translateY(-8px) scale(.94);}to{opacity:1;transform:translateY(0) scale(1);}}
.loginbrand h1{position:relative;z-index:1;color:#fff;font-size:32px;max-width:380px;line-height:1.25;animation:fadeIn 500ms 100ms both;}
.loginbrand p{position:relative;z-index:1;color:rgba(255,255,255,.85);font-size:14.5px;max-width:340px;line-height:1.6;margin-top:14px;animation:fadeIn 500ms 180ms both;}
.loginformside{display:flex;align-items:center;justify-content:center;padding:40px;}
.loginwrap{width:100%;max-width:340px;animation:fadeIn 500ms 200ms both;}
.loginwrap h2{font-size:22px;margin-bottom:6px;}
.loginwrap .helper{margin-bottom:26px;}
.inputicon{position:relative;}
.inputicon svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);pointer-events:none;}
.inputicon input{padding-left:34px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:2px;}
.spinner.dark{border-color:var(--line);border-top-color:var(--accent);}
@keyframes spin{to{transform:rotate(360deg);}}
@media (max-width:760px){.loginstage{grid-template-columns:1fr;grid-template-rows:auto 1fr;}.loginbrand{padding:36px 28px;min-height:180px;}.loginbrand h1{font-size:22px;}.loginbrand p{display:none;}.loginformside{padding:28px;}}
.toaststack{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-md);animation:toastIn 220ms cubic-bezier(.2,.8,.2,1);max-width:300px;}
.toast.good{background:var(--good);}
.toast.bad{background:var(--bad);}
.toast.leaving{animation:toastOut 200ms ease forwards;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px);}}
.applayout{display:flex;gap:20px;align-items:flex-start;}
.sidebar{width:172px;flex-shrink:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;}
.mainarea{flex:1;min-width:0;}
.navitem{display:flex;align-items:center;gap:10px;background:none;border:none;border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;transition:background var(--ease);font-family:'Inter',sans-serif;width:100%;}
.navitem:hover{background:var(--bg);}
.navitem.active{background:var(--accent);}
.navitem.active .navitem-label{color:#fff;}
.navitem.active .navitem-ic{background:rgba(255,255,255,.25);color:#fff;}
.navitem-ic{width:28px;height:28px;border-radius:8px;background:var(--bg);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.navitem-ic svg{width:14px;height:14px;}
.navitem-label{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12.5px;color:var(--ink);}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.statcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);}
.statnum{font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:700;color:var(--ink);}
.statlabel{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.moneyrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.moneycard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:left;cursor:pointer;transition:transform var(--ease), border-color var(--ease);box-shadow:var(--shadow-sm);font-family:'Inter',sans-serif;}
.moneycard:hover{transform:translateY(-2px);border-color:#C8C6DC;}
.moneycard.accent{border-left:3px solid var(--accent);}
.moneycard.clay{border-left:3px solid var(--clay);}
.moneytop{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;color:var(--ink-soft);}
.moneytop svg{width:16px;height:16px;flex-shrink:0;}
.moneycard.accent .moneytop svg{color:var(--accent);}
.moneycard.clay .moneytop svg{color:var(--clay);}
.moneynum{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:700;color:var(--ink);margin-top:8px;}
.moneylink{font-size:11px;margin-top:4px;}
.moneycard.accent .moneylink{color:var(--accent);}
.moneycard.clay .moneylink{color:var(--clay-text);}
.pendrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.pendcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;transition:transform var(--ease), border-color var(--ease);font-family:'Inter',sans-serif;}
.pendcard:hover{transform:translateY(-2px);border-color:#C8C6DC;}
.pendnum{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:700;color:var(--ink);}
.pendlabel{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.agendabox{max-height:190px;overflow-y:auto;}
.agendabox::-webkit-scrollbar{width:6px;}
.agendabox::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
.agendarow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.agendarow:last-child{border-bottom:none;}
.agendatime{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--accent);min-width:44px;}
.agendadot{width:7px;height:7px;border-radius:50%;background:var(--clay);flex-shrink:0;}
.dayrow{display:flex;gap:6px;margin-bottom:10px;}
.daybtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all var(--ease);}
.daybtn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
.tiporow{display:flex;gap:8px;margin-bottom:14px;}
.tipobtn{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;font-family:'Inter',sans-serif;transition:all var(--ease);}
.tipobtn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
.createhint{margin-top:5px;}
.createbtn{background:none;border:1px solid var(--clay);color:var(--clay-text);font-size:11.5px;font-weight:600;border-radius:7px;padding:5px 10px;cursor:pointer;font-family:'Inter',sans-serif;}
.createbtn:hover{background:var(--clay-soft);}
.addrhint{font-size:11px;color:var(--accent);margin:-6px 0 10px;}
.extratoggle{background:none;border:1px dashed var(--accent);color:var(--accent);font-weight:600;font-size:12.5px;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:2px;}
.extrabox{margin-top:10px;padding:12px;background:var(--accent-soft);border-radius:9px;}
.durbtn{padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}

function toast(msg, type='good'){
  let stack = document.querySelector('.toaststack');
  if(!stack){ stack = document.createElement('div'); stack.className='toaststack'; document.body.appendChild(stack); }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  stack.appendChild(el);

}

async function loadDashboardData(){
  try{
    const [{count:pipeline}, {count:activas}, {count:famCount}] = await Promise.all([
      sb.from('candidatas').select('*', {count:'exact', head:true}).in('estado', ['intake','entrevistada']),
      sb.from('ninieras').select('*', {count:'exact', head:true}).eq('activa', true),
      sb.from('familias').select('*', {count:'exact', head:true}),
    ]);
    const nums = document.querySelectorAll('#statrow .statnum');
    if(nums[0]) nums[0].textContent = pipeline ?? 0;
    if(nums[1]) nums[1].textContent = activas ?? 0;
    if(nums[2]) nums[2].textContent = famCount ?? 0;
  }catch(e){}

  try{
    const mesActual = currentMonthStr();
    const [y,m] = mesActual.split('-').map(Number);
    const desde = `${mesActual}-01`;
    const hasta = new Date(y, m, 1).toISOString().slice(0,10);
    const [{data:sits}, {data:gastos}] = await Promise.all([
      sb.from('sittings_traslados').select('cobro_familia,pago_ninera').gte('fecha', desde).lt('fecha', hasta),
      sb.from('gastos_generales').select('monto').gte('fecha', desde).lt('fecha', hasta),
    ]);
    const ingresos = (sits||[]).reduce((s,r)=>s+(Number(r.cobro_familia)||0), 0);
    const egresos = (sits||[]).reduce((s,r)=>s+(Number(r.pago_ninera)||0), 0) + (gastos||[]).reduce((s,g)=>s+(Number(g.monto)||0), 0);
    const elIng = document.getElementById('dash-ingresos'); if(elIng) elIng.textContent = '$'+ingresos.toLocaleString('es-UY');
    const elGas = document.getElementById('dash-gastos'); if(elGas) elGas.textContent = '$'+egresos.toLocaleString('es-UY');
  }catch(e){}

  const box = document.getElementById('agenda');
  let agendaItems = [];
  try{
    const { data, error } = await sb.from('asignaciones').select('*, familias(nombre)').order('hora_inicio', {ascending:true, nullsFirst:false});
    if(error){ box.innerHTML = errBox(error); return; }
    const hoy = diaHoy();
    agendaItems = (data||[]).filter(a => Array.isArray(a.dias) && a.dias.includes(hoy));
    if(!agendaItems.length){
      box.innerHTML = '<div class="empty">No hay niñeras agendadas para hoy — cargá los horarios en Familias.</div>';
    } else {
      box.innerHTML = agendaItems.map(a=>`
        <div class="agendarow">
          <div class="agendatime">${a.hora_inicio ? a.hora_inicio.slice(0,5) : '—'}</div>
          <div class="agendadot"></div>
          <div><b>${a.ninera_nombre}</b> → ${a.familias?.nombre || 'familia sin nombre'}${a.hora_fin ? ' · hasta '+a.hora_fin.slice(0,5) : ''}</div>
        </div>`).join('');
    }
  }catch(e){ box.innerHTML = errBox(e); return; }

  try{
    const { data: registrosHoy } = await sb.from('sittings_traslados').select('familia_nombre,ninera_nombre').eq('fecha', todayISO());
    dashPendientesHoy = agendaItems.filter(a=>{
      const famN = normaliza(a.familias?.nombre||'');
      const ninN = normaliza(a.ninera_nombre||'');
      return !(registrosHoy||[]).some(r => normaliza(r.familia_nombre)===famN && normaliza(r.ninera_nombre)===ninN);
    });
    const el = document.getElementById('dash-pend-num');
    if(el) el.textContent = dashPendientesHoy.length;
  }catch(e){}
}

async function guardarGastoGeneral(){
  const fecha = document.getElementById('fin-gasto-fecha').value;
  const concepto = document.getElementById('fin-gasto-concepto').value.trim();
  const monto = Number(document.getElementById('fin-gasto-monto').value)||0;

async function cargarFinanzas(){
  const summary = document.getElementById('fin-summary');
  const movsBox = document.getElementById('fin-movs');
  movsBox.innerHTML = '<div class="empty"><span class="spinner dark"></span> Cargando…</div>';
  const [y,m] = finMes.split('-').map(Number);
  const desde = `${finMes}-01`;
  const hasta = new Date(y, m, 1).toISOString().slice(0,10);
  const [{data:sits, error:e1}, {data:gastos, error:e2}] = await Promise.all([
    sb.from('sittings_traslados').select('*').gte('fecha', desde).lt('fecha', hasta),
    sb.from('gastos_generales').select('*').gte('fecha', desde).lt('fecha', hasta),
  ]);
  if(e1 || e2){ movsBox.innerHTML = errBox(e1||e2); return; }

  const egresosNinieras = (sits||[]).reduce((s,r)=>s+(Number(r.pago_ninera)||0), 0);
  const egresosGenerales = (gastos||[]).reduce((s,g)=>s+(Number(g.monto)||0), 0);
  const egresos = egresosNinieras + egresosGenerales;
  summary.innerHTML = `
    <div class="summarycard"><div class="statlabel">Ingresos de ${monthLabel(finMes)}</div><div class="statnum" style="font-size:19px;margin-top:3px;color:var(--good);">$${ingresos.toLocaleString('es-UY')}</div></div>
    <div class="summarycard"><div class="statlabel">Gastos de ${monthLabel(finMes)}</div><div class="statnum" style="font-size:19px;margin-top:3px;color:var(--clay-text);">$${egresos.toLocaleString('es-UY')}</div></div>
    <div class="summarycard" style="border-left:3px solid var(--accent);"><div class="statlabel">Balance</div><div class="statnum" style="font-size:19px;margin-top:3px;">$${(ingresos-egresos).toLocaleString('es-UY')}</div></div>
  `;
  const movs = [];
  (sits||[]).forEach(r=>{
    if(Number(r.cobro_familia)) movs.push({fecha:r.fecha, texto:`${r.familia_nombre} — ${r.tipo==='sitting'?'sitting':'traslado'} (${r.ninera_nombre})`, monto:Number(r.cobro_familia)});
    if(Number(r.pago_ninera)) movs.push({fecha:r.fecha, texto:`Pago a ${r.ninera_nombre}`, monto:-Number(r.pago_ninera)});
  });
  (gastos||[]).forEach(g=>{
    movs.push({fecha:g.fecha, texto:g.concepto, monto:-Number(g.monto), gastoId:g.id});
  });
  movs.sort((a,b)=> b.fecha.localeCompare(a.fecha));
  if(!movs.length){ movsBox.innerHTML = `<div class="empty">No hay movimientos cargados en ${monthLabel(finMes)} todavía.</div>`; return; }
  movsBox.innerHTML = `<h2 style="margin-bottom:10px;">Movimientos de ${monthLabel(finMes)}</h2>` + movs.map(mv=>{
    const fechaFmt = new Date(mv.fecha+'T00:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short'});
    return `<div class="agendarow" style="border-bottom:1px solid var(--line);">
      <div>${fechaFmt} · ${mv.texto}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:${mv.monto>0?'var(--good)':'var(--bad)'};">${mv.monto>0?'+':''}$${mv.monto.toLocaleString('es-UY')}</span>
        ${mv.gastoId ? `<button class="smallbtn danger" onclick="eliminarGastoGeneral('${mv.gastoId}')">Eliminar</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ---- Importador CSV ---- */
function parseCSV(text){
  const rows = []; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"' && text[i+1]==='"'){cur+='"';i++;} else if(ch==='"'){inQ=false;} else cur+=ch; }
    else{ if(ch==='"') inQ=true; else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur=''; if(row.some(v=>v!=='')) rows.push(row); row=[]; }
      else cur+=ch; }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
let csvRows=[], csvHeaders=[];
function handleCSV(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ const rows = parseCSV(reader.result); csvHeaders = rows[0]||[]; csvRows = rows.slice(1).filter(r=>r.length && r.some(v=>v.trim()!=='')); renderImportMap(); };
  reader.readAsText(file, 'UTF-8');
}
function renderImportMap(){
  const box = document.getElementById('importbox');
  const opts = ['<option value="">— no mapear —</option>'].concat(csvHeaders.map((h,i)=>`<option value="${i}">${h||'(columna '+(i+1)+')'}</option>`)).join('');
  box.innerHTML = `
    <div class="helper" style="margin-top:12px;">Se detectaron ${csvRows.length} filas. Revisá el mapeo:</div>
    ${FICHA_CAMPOS.map(f=>`<div class="maprow"><label style="margin:0;">${f.label}${f.key==='nombre'?' *':''}</label><select id="map-${f.key}">${opts}</select></div>`).join('')}
    <table class="importtable"><thead><tr>${csvHeaders.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${csvRows.slice(0,3).map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
    <button class="btn primary" onclick="importarCSV()">Importar ${csvRows.length} candidatas</button>
    <div id="importresult"></div>
  `;
  const usados = new Set();
  FICHA_CAMPOS.forEach(f=>{
    let idx=-1;
    for(let i=0;i<csvHeaders.length;i++){
      if(usados.has(i)) continue;
      const h = normaliza(csvHeaders[i]);
      if(f.hints.some(hint=>h.includes(normaliza(hint)))){ idx=i; break; }
    }
    if(idx>-1){ document.getElementById('map-'+f.key).value = idx; usados.add(idx); }
  });
}
async function importarCSV(){
  const map = {};
  FICHA_CAMPOS.forEach(f=>{ const v = document.getElementById('map-'+f.key).value; map[f.key] = v===''? null : parseInt(v); });
  if(map.nombre===null){ document.getElementById('importresult').innerHTML = '<div class="warnbox">Tenés que mapear al menos el campo Nombre.</div>'; return; }
  const registros = [];
  for(const row of csvRows){
    const nombre = (row[map.nombre]||'').trim();
    if(!nombre) continue;
    const item = { origen:'Instagram / Form', tipo:'Niñera', estado:'intake' };
    FICHA_CAMPOS.forEach(f=>{ if(map[f.key]!==null) item[f.key] = (row[map[f.key]]||'').trim(); });
    registros.push(item);
  }
  const { error } = await sb.from('candidatas').insert(registros);
  if(error){ document.getElementById('importresult').innerHTML = `<div class="warnbox">Error al importar: ${error.message}</div>`; return; }
  document.getElementById('importresult').innerHTML = '';
  toast(`Se importaron ${registros.length} candidatas.`);
  loadIntake();
}

      <input type="text" placeholder="Nombre" value="${r.name}" oninput="entrevistaState.refs[${i}].name=this.value">
      <input type="tel" placeholder="Teléfono" value="${r.phone}" oninput="entrevistaState.refs[${i}].phone=this.value">
      <input type="text" placeholder="Relación" value="${r.relacion}" oninput="entrevistaState.refs[${i}].relacion=this.value">
      <label class="chk"><input type="checkbox" ${r.confirmado?'checked':''} onchange="entrevistaState.refs[${i}].confirmado=this.checked"> Confirmada</label>
    </div>`).join('');
}
function calcular(){
  const scores = COMPETENCIAS.map(c => entrevistaState.competencias[c.key]?.score).filter(v=>v!==undefined);
  const completo = scores.length === COMPETENCIAS.length;
  const total = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const criticoMarcado = REDFLAGS.some(f=>f.critico && entrevistaState.redflags[f.key]);
  let badgeClass='warn', badgeTexto='Faltan puntajes', nota='Completá los bloques de arriba para tener una recomendación.';
  if(completo){
    if(criticoMarcado){ badgeClass='warn'; badgeTexto='Con reservas'; nota='Hay una señal de alerta crítica marcada — revisar antes de avanzar.'; }
    else if(total>=4.2){ badgeClass='good'; badgeTexto='Recomendada'; nota='Puntaje sólido y sin señales críticas.'; }
    else if(total>=3){ badgeClass='warn'; badgeTexto='Con reservas'; nota='Puntaje intermedio — conviene una segunda charla.'; }
    else { badgeClass='bad'; badgeTexto='No recomendada'; nota='Puntaje bajo en varias competencias.'; }
  }
  const gaugeColor = badgeClass==='good'?'var(--good)':badgeClass==='bad'?'var(--bad)':'var(--warn)';
  const pct = completo?(total/5*100):0;
  const box = document.getElementById('resultado');
  box.style.display='flex';
  box.innerHTML = `<div class="gauge" style="background:conic-gradient(${gaugeColor} ${pct}%, var(--line) 0);"><div class="inner"><div class="num">${completo?total.toFixed(1):'—'}</div><div class="max">/ 5</div></div></div>
    <div><span class="badge ${badgeClass}">${badgeTexto}</span><div class="resultnote">${nota}</div></div>`;
  document.getElementById('btnGuardar').disabled = !completo;
  return {total, completo, recomendacion:badgeTexto};
}
async function guardarCandidata(){
  const nombre = document.getElementById('f-nombre').value.trim();
  const warnArea = document.getElementById('warnArea');
  warnArea.innerHTML='';
  if(!nombre){ warnArea.innerHTML='<div class="warnbox">Falta el nombre.</div>'; return; }
  const {total, completo, recomendacion} = calcular();
  if(!completo){ warnArea.innerHTML='<div class="warnbox">Faltan puntajes en algún bloque.</div>'; return; }
  const psico = {};
  PSICO_IMGS.forEach(img=>{ const el = document.querySelector(`[data-psico="${img.id}"]`); psico[img.id]= el?el.value:''; });

  let candidataId = entrevistaState.candidataId;
  if(candidataId){
    const { error } = await sb.from('candidatas').update({ estado:'entrevistada', telefono:document.getElementById('f-telefono').value, zona:document.getElementById('f-zona').value }).eq('id', candidataId);
    if(error){ warnArea.innerHTML = errBox(error); return; }
  } else {
    const { data, error } = await sb.from('candidatas').insert({
      nombre, telefono:document.getElementById('f-telefono').value, zona:document.getElementById('f-zona').value,
      origen:document.getElementById('f-origen').value, experiencia:document.getElementById('f-exp-previa').value,
      tipo: entrevistaState.tipo || 'Niñera', estado:'entrevistada',
    }).select().single();
    if(error){ warnArea.innerHTML = errBox(error); return; }
    candidataId = data.id;
  }

  const { error: e2 } = await sb.from('entrevistas').insert({
    candidata_id: candidataId,
    fecha: document.getElementById('f-fecha').value || null,
    entrevisto: document.getElementById('f-entrevisto').value,
    rol: document.getElementById('f-rol').value,
    puntajes: entrevistaState.competencias,
    redflags: entrevistaState.redflags,
    referencias: entrevistaState.refs,
    psico,
    explicacion_juegos: entrevistaState.explicacionJuegos,
    notas: document.getElementById('f-notas').value,
    total: Number(total.toFixed(2)),
    recomendacion,
  });
  if(e2){ warnArea.innerHTML = errBox(e2); return; }
  toast('Candidata guardada — está en "Candidatas guardadas".');
  limpiarForm();
}
function limpiarForm(){
  entrevistaState = { competencias:{}, redflags:{}, refs:[], candidataId:null, fichaOrigen:null, tipo:'Niñera', explicacionJuegos:null };

async function contratar(candidataId){
  const c = candidatasItems.find(x=>x.candidatas.id===candidataId);
  const cd = c.candidatas;
  const ninera = {
    candidata_id: candidataId, nombre:cd.nombre, telefono:cd.telefono, tipo:cd.tipo||'Niñera',
    zona: document.getElementById('hire-zona').value, foto: document.getElementById('hire-foto').value, notas: c.notas,
  };
  const { error: e1 } = await sb.from('ninieras').insert(ninera);
  if(e1){ toast('No se pudo contratar: '+e1.message,'bad'); return; }
  const { error: e2 } = await sb.from('candidatas').update({ estado:'contratada' }).eq('id', candidataId);
  if(e2){ toast('Niñera creada, pero no se pudo actualizar el estado: '+e2.message,'bad'); }
  toast('Pasó a Niñeras.');
  document.getElementById('detalle').innerHTML='';
  cargarGuardadas();
}
async function eliminarCandidata(candidataId){
  if(!confirm('¿Eliminar? No se puede deshacer.')) return;
  const { error } = await sb.from('candidatas').delete().eq('id', candidataId);
  if(error){ toast('No se pudo eliminar: '+error.message,'bad'); return; }
  document.getElementById('detalle').innerHTML='';
  cargarGuardadas();
}
function exportCSVcand(){
  if(!candidatasItems.length){ toast('No hay candidatas para exportar.','bad'); return; }
  const headers=['Nombre','Fecha','Zona','Rol','Teléfono','Puntaje','Recomendación','Contratada','Notas'];
  const rows = candidatasItems.map(c=>[c.candidatas.nombre,c.fecha,c.candidatas.zona,c.rol,c.candidatas.telefono,c.total,c.recomendacion,c.candidatas.estado==='contratada'?'Sí':'No',(c.notas||'').replace(/\n/g,' ')]);
  descargarCSV(headers, rows, 'candidatas_guardadas.csv');
}
function descargarCSV(headers, rows, filename){
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}

      </div>

      <div class="actions" style="margin-top:14px;"><button class="smallbtn danger" onclick="eliminarFamilia('${f.id}')">Eliminar familia</button></div>
    </div>`;
  }).join('');
}
async function addAsignacion(famId){
  const nombre = document.getElementById('asig-nombre-'+famId).value.trim();
  if(!nombre){ toast('Falta el nombre de la niñera.','bad'); return; }
  const dias = Array.from(document.querySelectorAll(`#asig-dias-${famId} .daybtn.selected`)).map(b=>b.textContent);
  const asig = { familia_id:famId, ninera_nombre:nombre, cobro_hora:document.getElementById('asig-cobro-'+famId).value||null, pago_hora:document.getElementById('asig-pago-'+famId).value||null,
    dias, hora_inicio:document.getElementById('asig-horaini-'+famId).value||null, hora_fin:document.getElementById('asig-horafin-'+famId).value||null };
  const { error } = await sb.from('asignaciones').insert(asig);
  if(error){ toast('No se pudo agregar: '+error.message,'bad'); return; }
  toast('Asignación agregada.');
  cargarFamilias();
}
async function quitarAsignacion(id){
  const { error } = await sb.from('asignaciones').delete().eq('id', id);
  if(error){ toast('No se pudo quitar: '+error.message,'bad'); return; }
  cargarFamilias();
}
async function eliminarFamilia(id){
  if(!confirm('¿Eliminar esta familia? No se puede deshacer.')) return;
  const { error } = await sb.from('familias').delete().eq('id', id);
  if(error){ toast('No se pudo eliminar: '+error.message,'bad'); return; }
  cargarFamilias();
}

/* ================= SITTINGS & TRASLADOS ================= */
let sitFamilias = [];
let sitNinieras = [];
let sitAsignaciones = [];
let sitItems = [];
let sitTipo = 'sitting';
let sitEditId = null;
let sitFamiliaSel = null;
let sitNineraSel = null;
let sitOrigenAuto = true;
let sitMes = null;

function currentMonthStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthLabel(mesStr){
  const [y,m] = mesStr.split('-').map(Number);
  const f = new Intl.DateTimeFormat('es-UY', {month:'long', year:'numeric'}).format(new Date(y, m-1, 1));
  return f.charAt(0).toUpperCase() + f.slice(1);
}
function findFamilia(nombre){ const n = normaliza(nombre); return sitFamilias.find(f=>normaliza(f.nombre)===n) || null; }
function findNinera(nombre){ const n = normaliza(nombre); return sitNinieras.find(x=>normaliza(x.nombre)===n) || null; }

async function renderSittings(body){
  sitMes = sitMes || currentMonthStr();
  sitEditId = null; sitFamiliaSel = null; sitNineraSel = null; sitOrigenAuto = true; sitTipo = 'sitting';
  body.innerHTML = `
    <div id="sit-form-wrap"><div class="card"><div class="empty"><span class="spinner dark"></span> Cargando…</div></div></div>
    <div class="mesbar">
      <div class="field" style="margin:0;max-width:200px;"><label>Mes</label><input type="month" id="sit-mes" value="${sitMes}" onchange="cambiarSitMes()"></div>
      <button class="smallbtn" onclick="exportarSitCSV()">Exportar CSV</button>
    </div>
    <div class="summary3" id="sit-summary"></div>
    <div class="card" id="sit-list-wrap"></div>
  `;
  await cargarSitBase();
  renderSitForm();
  cargarSitLista();
}
async function cargarSitBase(){
  const [{data:fams}, {data:nins}, {data:asigs}] = await Promise.all([
    sb.from('familias').select('id,nombre,direccion').order('nombre'),
    sb.from('ninieras').select('id,nombre').eq('activa', true).order('nombre'),
    sb.from('asignaciones').select('familia_id,ninera_nombre,cobro_hora,pago_hora'),
  ]);
  sitFamilias = fams || [];
  sitNinieras = nins || [];
  sitAsignaciones = asigs || [];
}

function sitFormHTML(){
  return `
    <div class="card">
      <h2>${sitEditId ? 'Editar registro' : 'Nuevo registro'}</h2>
      <div class="tiporow">
        <button type="button" class="tipobtn ${sitTipo==='sitting'?'selected':''}" id="sit-tipo-sitting" onclick="setSitTipo('sitting')">Sitting</button>
        <button type="button" class="tipobtn ${sitTipo==='traslado'?'selected':''}" id="sit-tipo-traslado" onclick="setSitTipo('traslado')">Traslado</button>
      </div>
      <div class="grid3">
        <div class="field"><label>Registró</label><select id="sit-registro"><option>Paulina G</option><option>Delfina F</option></select></div>
        <div class="field">
          <label>Familia</label>
          <input type="text" id="sit-familia" list="sit-familias-dl" autocomplete="off" oninput="onSitFamiliaInput()">
          <datalist id="sit-familias-dl">${sitFamilias.map(f=>`<option value="${f.nombre}">`).join('')}</datalist>
          <div class="createhint" id="sit-familia-create"></div>
        </div>
        <div class="field">
          <label>Niñera</label>
          <input type="text" id="sit-ninera" list="sit-ninieras-dl" autocomplete="off" oninput="onSitNineraInput()">
          <datalist id="sit-ninieras-dl">${sitNinieras.map(n=>`<option value="${n.nombre}">`).join('')}</datalist>
          <div class="createhint" id="sit-ninera-create"></div>
        </div>
      </div>
      <div id="sit-camposTipo"></div>
      <div class="grid2">
        <div class="field"><label>Cobro a familia</label><input type="number" id="sit-cobro" value="0" oninput="calcSitMargen()"></div>
        <div class="field"><label>Pago a niñera</label><input type="number" id="sit-pago" value="0" oninput="calcSitMargen()"></div>
      </div>
      <button type="button" class="extratoggle" id="sit-extra-toggle" onclick="toggleSitExtra()">+ Horas o cobro extra</button>
      <div class="extrabox" id="sit-extra-box" style="display:none;"></div>
      <div class="field" style="margin-top:12px;"><label>Notas</label><textarea id="sit-notas"></textarea></div>
      <div class="actions">
        <button class="btn primary" onclick="guardarSitting()">${sitEditId ? 'Guardar cambios' : 'Guardar registro'}</button>
        ${sitEditId ? `<button class="btn ghost" onclick="cancelarEdicionSitting()">Cancelar edición</button>` : ''}
        <div style="margin-left:auto;align-self:center;font-size:13px;color:var(--ink-soft);">Margen: <b id="sit-margen" style="color:var(--good);font-family:'IBM Plex Mono',monospace;">$0</b></div>
      </div>
    </div>
  `;
}
function sitCamposTipoHTML(){
  if(sitTipo==='sitting'){
    return `<div class="grid3">
      <div class="field"><label>Fecha</label><input type="date" id="sit-fecha" value="${todayISO()}"></div>
      <div class="field"><label>Hora inicio</label><input type="time" id="sit-horaini"></div>
      <div class="field"><label>Hora fin</label><input type="time" id="sit-horafin"></div>
    </div>`;
  }
  return `<div class="grid3">
      <div class="field"><label>Fecha</label><input type="date" id="sit-fecha" value="${todayISO()}"></div>
      <div class="field"><label>Km recorridos</label><input type="number" id="sit-km"></div>
      <div class="field"><label>&nbsp;</label><button type="button" class="smallbtn" style="width:100%;" onclick="verRutaMaps()">🗺️ Ver ruta en Maps</button></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Origen</label><input type="text" id="sit-origen" oninput="sitOrigenAuto=false;"></div>
      <div class="field"><label>Destino</label><input type="text" id="sit-destino"></div>
    </div>
    <div class="addrhint" id="sit-addr-hint" style="display:none;"></div>`;
}
function renderSitForm(){
  const wrap = document.getElementById('sit-form-wrap');
  if(!wrap) return;
  wrap.innerHTML = sitFormHTML();
  document.getElementById('sit-camposTipo').innerHTML = sitCamposTipoHTML();
  calcSitMargen();
}
function setSitTipo(t){
  sitTipo = t;
  const bS = document.getElementById('sit-tipo-sitting'), bT = document.getElementById('sit-tipo-traslado');
  if(bS) bS.classList.toggle('selected', t==='sitting');
  if(bT) bT.classList.toggle('selected', t==='traslado');
  sitOrigenAuto = true;
  document.getElementById('sit-camposTipo').innerHTML = sitCamposTipoHTML();
  const box = document.getElementById('sit-extra-box');
  if(box) box.style.display = 'none';
  if(t==='traslado') aplicarDireccionSugerida();
  calcSitMargen();
}

/* ---- crear familia/niñera al vuelo ---- */
function onSitFamiliaInput(){
  const val = document.getElementById('sit-familia').value.trim();
  sitFamiliaSel = findFamilia(val);
  const box = document.getElementById('sit-familia-create');
  box.innerHTML = (val && !sitFamiliaSel) ? `<button type="button" class="createbtn" onclick="crearFamiliaRapida()">+ Crear familia "${val}"</button>` : '';
  sitOrigenAuto = true;
  if(sitTipo==='traslado') aplicarDireccionSugerida();
  actualizarTarifaExtra();
}
function onSitNineraInput(){
  const val = document.getElementById('sit-ninera').value.trim();
  sitNineraSel = findNinera(val);
  const box = document.getElementById('sit-ninera-create');
  box.innerHTML = (val && !sitNineraSel) ? `<button type="button" class="createbtn" onclick="crearNineraRapida()">+ Crear niñera "${val}"</button>` : '';
  actualizarTarifaExtra();
}
async function crearFamiliaRapida(){
  const val = document.getElementById('sit-familia').value.trim();
  if(!val) return;
  const { data, error } = await sb.from('familias').insert({nombre:val}).select().single();
  if(error){ toast('No se pudo crear la familia: '+error.message, 'bad'); return; }
  sitFamilias.push(data);
  sitFamiliaSel = data;
  document.getElementById('sit-familia-create').innerHTML = '<div style="font-size:11.5px;color:var(--good);font-weight:600;">Familia creada.</div>';
  const dl = document.getElementById('sit-familias-dl'); if(dl) dl.insertAdjacentHTML('beforeend', `<option value="${data.nombre}">`);
  toast('Familia creada — le podés agregar zona, teléfono y dirección después desde Familias.');
}
async function crearNineraRapida(){
  const val = document.getElementById('sit-ninera').value.trim();
  if(!val) return;
  const { data, error } = await sb.from('ninieras').insert({nombre:val, activa:true}).select().single();
  if(error){ toast('No se pudo crear la niñera: '+error.message, 'bad'); return; }
  sitNinieras.push(data);
  sitNineraSel = data;
  document.getElementById('sit-ninera-create').innerHTML = '<div style="font-size:11.5px;color:var(--good);font-weight:600;">Niñera creada.</div>';
  const dl = document.getElementById('sit-ninieras-dl'); if(dl) dl.insertAdjacentHTML('beforeend', `<option value="${data.nombre}">`);
  toast('Niñera creada — le podés agregar zona y teléfono después desde Niñeras.');
}

/* ---- dirección sugerida para traslados ---- */
function aplicarDireccionSugerida(){
  const hint = document.getElementById('sit-addr-hint');
  const origenInput = document.getElementById('sit-origen');
  if(!hint || !origenInput) return;
  if(sitFamiliaSel && sitFamiliaSel.direccion && sitOrigenAuto){
    origenInput.value = sitFamiliaSel.direccion;
    hint.textContent = `Dirección sugerida desde la ficha de ${sitFamiliaSel.nombre} — la podés editar si el traslado arranca en otro lado.`;
    hint.style.display = 'block';
  } else {
    hint.style.display = 'none';
  }
}
function verRutaMaps(){
  const o = (document.getElementById('sit-origen')||{}).value?.trim();
  const d = (document.getElementById('sit-destino')||{}).value?.trim();
  if(!o || !d){ toast('Cargá origen y destino primero.', 'bad'); return; }
  window.open('https://www.google.com/maps/dir/'+encodeURIComponent(o)+'/'+encodeURIComponent(d), '_blank');
}

/* ---- horas / cobro extra ---- */
function toggleSitExtra(){
  const box = document.getElementById('sit-extra-box');
  const opening = box.style.display === 'none';
  box.style.display = opening ? 'block' : 'none';
  if(opening) actualizarTarifaExtra();
}
function tarifaParaSeleccion(){
  if(!sitFamiliaSel || !sitNineraSel) return null;
  const nomb = normaliza(sitNineraSel.nombre);
  return sitAsignaciones.find(a => a.familia_id===sitFamiliaSel.id && normaliza(a.ninera_nombre||'')===nomb) || null;
}
function extraManualHTML(msg){
  return `<div class="helper" style="margin:0 0 8px;">${msg}</div>
    <div class="grid2">
      <div class="field"><label>Extra cobro</label><input type="number" id="sit-extra-cobro-manual" value="0"></div>
      <div class="field"><label>Extra pago</label><input type="number" id="sit-extra-pago-manual" value="0"></div>
    </div>
    <button type="button" class="smallbtn" onclick="aplicarExtraManual()">Sumar extra</button>`;
}
function actualizarTarifaExtra(){
  const box = document.getElementById('sit-extra-box');
  if(!box || box.style.display==='none') return;
  if(!sitFamiliaSel || !sitNineraSel){
    box.innerHTML = extraManualHTML('Elegí una familia y una niñera ya cargadas para calcular el extra según su tarifa, o cargalo a mano.');
    return;
  }
  const asig = tarifaParaSeleccion();
  if(asig && (Number(asig.cobro_hora)||Number(asig.pago_hora))){
    box.innerHTML = `
      <div class="helper" style="margin:0 0 6px;">Tarifa encontrada para ${sitNineraSel.nombre} × ${sitFamiliaSel.nombre}: $${asig.cobro_hora||0}/h cobro · $${asig.pago_hora||0}/h pago</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${[30,60,90,120].map(min=>`<button type="button" class="durbtn" onclick="aplicarExtraHoras(${min}, ${Number(asig.cobro_hora)||0}, ${Number(asig.pago_hora)||0})">${min<60 ? min+' min' : (min/60)+' h'}</button>`).join('')}
      </div>
      <div id="sit-extra-result" style="font-size:12.5px;margin-top:8px;color:var(--ink-soft);"></div>`;
  } else {
    box.innerHTML = extraManualHTML('No encontramos una tarifa por hora cargada para esta niñera y familia (revisá Familias) — cargá el extra a mano.');
  }
}
function aplicarExtraHoras(min, tarifaCobro, tarifaPago){
  const horas = min/60;
  const extraCobro = Math.round(tarifaCobro*horas);
  const extraPago = Math.round(tarifaPago*horas);
  const cobroInput = document.getElementById('sit-cobro');
  const pagoInput = document.getElementById('sit-pago');
  cobroInput.value = (Number(cobroInput.value)||0) + extraCobro;
  pagoInput.value = (Number(pagoInput.value)||0) + extraPago;
  const res = document.getElementById('sit-extra-result');
  if(res) res.textContent = `+${min<60 ? min+' min' : (min/60)+' h'} → +$${extraCobro} cobro, +$${extraPago} pago (ya sumado arriba)`;
  calcSitMargen();
}
function aplicarExtraManual(){
  const ec = Number(document.getElementById('sit-extra-cobro-manual').value)||0;
  const ep = Number(document.getElementById('sit-extra-pago-manual').value)||0;
  const cobroInput = document.getElementById('sit-cobro');
  const pagoInput = document.getElementById('sit-pago');
  cobroInput.value = (Number(cobroInput.value)||0) + ec;
  pagoInput.value = (Number(pagoInput.value)||0) + ep;
  toast('Extra sumado al cobro y al pago.');
  calcSitMargen();
}
function calcSitMargen(){
  const c = Number((document.getElementById('sit-cobro')||{}).value)||0;
  const p = Number((document.getElementById('sit-pago')||{}).value)||0;
  const el = document.getElementById('sit-margen');
  if(el) el.textContent = '$'+(c-p);
}

/* ---- guardar / editar / eliminar ---- */
async function guardarSitting(){
  const familiaNombre = document.getElementById('sit-familia').value.trim();
  const nineraNombre = document.getElementById('sit-ninera').value.trim();
  const fecha = document.getElementById('sit-fecha').value;
  if(!familiaNombre || !nineraNombre || !fecha){ toast('Faltan familia, niñera o fecha.', 'bad'); return; }
  const registro = {
    tipo: sitTipo,
    registrado_por: document.getElementById('sit-registro').value,
    familia_id: sitFamiliaSel ? sitFamiliaSel.id : null,
    familia_nombre: familiaNombre,
    ninera_id: sitNineraSel ? sitNineraSel.id : null,
    ninera_nombre: nineraNombre,
    fecha,
    cobro_familia: Number(document.getElementById('sit-cobro').value)||0,
    pago_ninera: Number(document.getElementById('sit-pago').value)||0,
    notas: document.getElementById('sit-notas').value || null,
    hora_inicio: null, hora_fin: null, km: null, origen: null, destino: null,
  };
  if(sitTipo==='sitting'){
    registro.hora_inicio = document.getElementById('sit-horaini').value || null;
    registro.hora_fin = document.getElementById('sit-horafin').value || null;
  } else {
    const km = document.getElementById('sit-km').value;
    registro.km = km ? Number(km) : null;
    registro.origen = document.getElementById('sit-origen').value || null;
    registro.destino = document.getElementById('sit-destino').value || null;
  }
  let error;
  if(sitEditId){
    ({ error } = await sb.from('sittings_traslados').update(registro).eq('id', sitEditId));
  } else {
    ({ error } = await sb.from('sittings_traslados').insert(registro));
  }
  if(error){ toast('No se pudo guardar: '+error.message, 'bad'); return; }
  toast(sitEditId ? 'Registro actualizado.' : 'Registro guardado.');
  sitEditId = null; sitFamiliaSel = null; sitNineraSel = null; sitOrigenAuto = true; sitTipo = 'sitting';
  renderSitForm();
  cargarSitLista();
}
function cancelarEdicionSitting(){
  sitEditId = null; sitFamiliaSel = null; sitNineraSel = null; sitOrigenAuto = true; sitTipo = 'sitting';
  renderSitForm();
}
function editarSitting(id){
  const r = sitItems.find(x=>x.id===id);
  if(!r) return;
  sitEditId = id;
  sitTipo = r.tipo;
  sitFamiliaSel = sitFamilias.find(f=>f.id===r.familia_id) || findFamilia(r.familia_nombre);
  sitNineraSel = sitNinieras.find(n=>n.id===r.ninera_id) || findNinera(r.ninera_nombre);
  sitOrigenAuto = false;
  renderSitForm();
  setTimeout(()=>{
    document.getElementById('sit-familia').value = r.familia_nombre || '';
    document.getElementById('sit-ninera').value = r.ninera_nombre || '';
    document.getElementById('sit-registro').value = r.registrado_por || 'Paulina G';
    document.getElementById('sit-fecha').value = r.fecha || '';
    document.getElementById('sit-cobro').value = r.cobro_familia || 0;
    document.getElementById('sit-pago').value = r.pago_ninera || 0;
    document.getElementById('sit-notas').value = r.notas || '';
    if(r.tipo==='sitting'){
      if(document.getElementById('sit-horaini')) document.getElementById('sit-horaini').value = r.hora_inicio ? r.hora_inicio.slice(0,5) : '';
      if(document.getElementById('sit-horafin')) document.getElementById('sit-horafin').value = r.hora_fin ? r.hora_fin.slice(0,5) : '';
    } else {
      if(document.getElementById('sit-km')) document.getElementById('sit-km').value = r.km || '';
      if(document.getElementById('sit-origen')) document.getElementById('sit-origen').value = r.origen || '';
      if(document.getElementById('sit-destino')) document.getElementById('sit-destino').value = r.destino || '';
    }
    calcSitMargen();
  }, 30);
  window.scrollTo({top:0, behavior:'smooth'});
}
async function eliminarSitting(id){
  if(!confirm('¿Eliminar este registro? No se puede deshacer.')) return;
  const { error } = await sb.from('sittings_traslados').delete().eq('id', id);
  if(error){ toast('No se pudo eliminar: '+error.message, 'bad'); return; }
  toast('Registro eliminado.');
  cargarSitLista();
}

/* ---- lista del mes / resumen / export ---- */
function cambiarSitMes(){ sitMes = document.getElementById('sit-mes').value; cargarSitLista(); }
async function cargarSitLista(){
  const wrap = document.getElementById('sit-list-wrap');
  const summary = document.getElementById('sit-summary');
  if(!wrap) return;
  wrap.innerHTML = '<div class="empty"><span class="spinner dark"></span> Cargando…</div>';
  const [y,m] = sitMes.split('-').map(Number);
  const desde = `${sitMes}-01`;
  const hasta = new Date(y, m, 1).toISOString().slice(0,10);
  const { data, error } = await sb.from('sittings_traslados').select('*').gte('fecha', desde).lt('fecha', hasta).order('fecha', {ascending:false});
  if(error){ wrap.innerHTML = errBox(error); return; }
  sitItems = data || [];
  const cobrado = sitItems.reduce((s,r)=>s+(Number(r.cobro_familia)||0), 0);
  const pagado = sitItems.reduce((s,r)=>s+(Number(r.pago_ninera)||0), 0);
  summary.innerHTML = `
    <div class="summarycard"><div class="statlabel">Cobrado en ${monthLabel(sitMes)}</div><div class="statnum" style="font-size:19px;margin-top:3px;">$${cobrado}</div></div>
    <div class="summarycard"><div class="statlabel">Pagado en ${monthLabel(sitMes)}</div><div class="statnum" style="font-size:19px;margin-top:3px;">$${pagado}</div></div>
    <div class="summarycard" style="border-left:3px solid var(--good);"><div class="statlabel">Margen</div><div class="statnum" style="font-size:19px;margin-top:3px;color:var(--good);">$${cobrado-pagado}</div></div>
  `;
  if(!sitItems.length){ wrap.innerHTML = `<div class="empty">No hay registros cargados en ${monthLabel(sitMes)} todavía.</div>`; return; }
  wrap.innerHTML = `
    <h2 style="margin-bottom:10px;">Registros de ${monthLabel(sitMes)}</h2>
    <table class="asigtable"><thead><tr><th>Fecha</th><th>Tipo</th><th>Familia</th><th>Niñera</th><th>Cobro</th><th>Pago</th><th>Margen</th><th></th></tr></thead>
    <tbody>${sitItems.map(r=>{
      const margen = (Number(r.cobro_familia)||0) - (Number(r.pago_ninera)||0);
      const fechaFmt = r.fecha ? new Date(r.fecha+'T00:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short'}) : '—';
      return `<tr><td>${fechaFmt}</td><td>${r.tipo==='sitting'?'Sitting':'Traslado'}</td><td>${r.familia_nombre}</td><td>${r.ninera_nombre}</td><td>$${r.cobro_familia||0}</td><td>$${r.pago_ninera||0}</td><td class="${margen>=0?'margenpos':'margenneg'}">$${margen}</td><td><button class="smallbtn" onclick="editarSitting('${r.id}')">Editar</button> <button class="smallbtn danger" onclick="eliminarSitting('${r.id}')">Eliminar</button></td></tr>`;
    }).join('')}</tbody></table>
  `;
}
function exportarSitCSV(){
  if(!sitItems.length){ toast('No hay registros para exportar en este mes.', 'bad'); return; }
  const headers = ['Fecha','Tipo','Registró','Familia','Niñera','Hora inicio','Hora fin','Km','Origen','Destino','Cobro familia','Pago niñera','Margen','Notas'];
  const rows = sitItems.map(r=>[r.fecha, r.tipo, r.registrado_por, r.familia_nombre, r.ninera_nombre, r.hora_inicio||'', r.hora_fin||'', r.km||'', r.origen||'', r.destino||'', r.cobro_familia||0, r.pago_ninera||0, (Number(r.cobro_familia)||0)-(Number(r.pago_ninera)||0), (r.notas||'').replace(/\n/g,' ')]);
  descargarCSV(headers, rows, `sittings_traslados_${sitMes}.csv`);
}

boot();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
